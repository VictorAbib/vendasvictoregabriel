<title>Quanto Sobrou</title>

<style id="css">
*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,p,ul,ol,li,figure,table,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}

:root{
  /* sem isto o navegador trata a pagina como "so clara" e escurece tudo por conta propria */
  color-scheme:light;
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#ECF0EE; --line:#DBE2DF; --line-2:#C6D0CC;
  --ink:#111917; --ink-2:#4A5551; --ink-3:#5C6662;
  --accent:#0B6B5F; --accent-ink:#FFFFFF; --accent-soft:#DBEDE8;
  --pos:#136B38; --neg:#A81E27; --warn:#845804;
  --cupom:#FBFCFB;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 10px 28px -16px rgba(17,25,23,.22);
  --sans:ui-sans-serif,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","Roboto Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1211; --surface:#151D1B; --surface-2:#1D2725; --line:#293432; --line-2:#3A4744;
    --ink:#E5EDEA; --ink-2:#A1ADA9; --ink-3:#99A39E;
    --accent:#3FC3AA; --accent-ink:#05221D; --accent-soft:#123330;
    --pos:#4FCC7C; --neg:#F0787E; --warn:#DFA73B;
    --cupom:#192220;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1211; --surface:#151D1B; --surface-2:#1D2725; --line:#293432; --line-2:#3A4744;
  --ink:#E5EDEA; --ink-2:#A1ADA9; --ink-3:#99A39E;
  --accent:#3FC3AA; --accent-ink:#05221D; --accent-soft:#123330;
  --pos:#4FCC7C; --neg:#F0787E; --warn:#DFA73B;
  --cupom:#192220;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}

body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:20px 16px 64px;
}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- cabecalho ---------- */
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.marca h1{font-size:clamp(26px,4.4vw,36px);font-weight:760;letter-spacing:-.028em;line-height:1.05;text-wrap:balance}
.marca p{color:var(--ink-2);font-size:13.5px;margin-top:5px;max-width:56ch}
.topo-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;
  font-size:13.5px;font-weight:560;cursor:pointer;transition:background .13s,border-color .13s,transform .06s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-forte{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:640}
.btn-forte:hover{background:var(--accent);filter:brightness(1.08);border-color:var(--accent)}
.btn-larg{width:100%;padding:13px;font-size:15px}
.btn-mini{padding:7px 12px;font-size:12.5px;white-space:nowrap}
.btn-fantasma{background:none;border-color:transparent;color:var(--ink-3)}
.btn-fantasma:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--ink)}
:where(a,button,input,label,summary):focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- entrada ---------- */
.login-tela{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);
}
.login-caixa{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:26px 24px;
}
.login-caixa h2{font-size:20px;font-weight:720;letter-spacing:-.02em;margin-bottom:4px}
.login-caixa p{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
.login-quem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.login-quem button{
  padding:13px 10px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;
  font-size:15px;font-weight:640;cursor:pointer;color:var(--ink);min-height:48px;
  transition:background .13s,border-color .13s,color .13s;
}
.login-quem button:hover{border-color:var(--ink-3)}
.login-quem button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.login-erro{font-size:12.5px;color:var(--neg);font-weight:600;margin-top:10px;line-height:1.45;min-height:1px}
.sessao{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;
}
.sessao b{color:var(--ink);font-weight:640}
.sessao button{
  border:none;background:none;cursor:pointer;color:var(--ink-3);font-size:12px;font-weight:600;
  padding:4px 9px;border-radius:14px;
}
.sessao button:hover{background:var(--surface);color:var(--ink)}
.aviso-alheio{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;
  line-height:1.45;margin-bottom:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.aviso-alheio b{color:var(--ink);font-weight:640}

/* ---------- abas ---------- */
.abas{
  display:flex;gap:6px;margin-bottom:18px;padding:5px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);width:fit-content;max-width:100%;flex-wrap:wrap;
}
.aba{
  display:inline-flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;
  padding:9px 16px;border-radius:9px;font-size:14px;font-weight:620;color:var(--ink-2);
  transition:background .13s,color .13s;min-height:40px;
}
.aba:hover{background:var(--surface);color:var(--ink)}
.aba[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.aba[aria-selected="true"]:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.06)}
.aba-n{
  font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
}
.aba[aria-selected="true"] .aba-n{background:rgba(0,0,0,.18);color:var(--accent-ink);border-color:transparent}
@media (pointer:coarse),(max-width:719px){ .aba{min-height:44px;padding:10px 18px} }

/* ---------- avisos ---------- */
.aviso{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  font-size:13px;line-height:1.45;margin-bottom:16px;border:1px solid;
}
.aviso b{font-weight:640}
.aviso-info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.aviso-alerta{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 34%,transparent);color:var(--ink)}
.aviso-erro{background:color-mix(in srgb,var(--neg) 12%,var(--surface));border-color:color-mix(in srgb,var(--neg) 34%,transparent);color:var(--ink)}
[hidden]{display:none !important}

/* ---------- grade ---------- */
.grade{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:980px){ .grade{grid-template-columns:minmax(360px,410px) 1fr;gap:26px} .coluna-esq{position:sticky;top:20px} }

.cartao{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.cartao:last-child{margin-bottom:0}
.cartao-corpo{padding:18px}
.rotulo-secao{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:12px;
}
.conta{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--ink-2);
}

/* ---------- formulario ---------- */
.campo{margin-bottom:15px}
.campo:last-child{margin-bottom:0}
.campo label,.campo .rot{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.entrada{
  width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;
  padding:11px 12px;font-size:15px;transition:border-color .13s,background .13s;
}
.entrada:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.entrada::placeholder{color:var(--ink-3)}
.entrada-dinheiro{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.qtd-custo{display:grid;grid-template-columns:88px 1fr;gap:11px}
.com-prefixo{position:relative}
.com-prefixo .prefixo{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:13px;color:var(--ink-3);pointer-events:none;font-weight:600;
}
.com-prefixo .entrada{padding-left:38px}
.dica{
  font-size:12px;color:var(--accent);margin-top:7px;font-weight:600;
  display:flex;align-items:flex-start;gap:6px;line-height:1.4;
}
.dica b{font-family:var(--mono);font-weight:700}
.marcar{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.marcar input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.marcar small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}

/* ---------- canais ---------- */
.canais{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.canal{position:relative;cursor:pointer}
.canal input{position:absolute;opacity:0;width:0;height:0}
.canal-face{
  display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:9px;
  border:1.5px solid var(--line-2);background:var(--surface);
  font-size:12.5px;font-weight:600;line-height:1.15;transition:border-color .13s,background .13s,color .13s;
  min-height:40px;
}
.canal:hover .canal-face{border-color:var(--ink-3)}
.ponto{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.canal input:checked + .canal-face{
  background:var(--marca);color:var(--marca-txt);border-color:var(--marca);
  box-shadow:0 2px 10px -3px var(--marca);
}
.canal input:checked + .canal-face .ponto{background:var(--marca-txt) !important;opacity:.55}
.canal input:focus-visible + .canal-face{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- cupom ---------- */
.cupom-area{margin-top:16px}
.cupom{
  position:relative;background:var(--cupom);border:1px solid var(--line);
  border-bottom:none;border-radius:12px 12px 0 0;padding:16px 17px 14px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.cupom::after{
  content:"";position:absolute;top:100%;left:-1px;right:-1px;height:9px;background:var(--cupom);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/13px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/13px 100%;
}
.cupom-topo{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:10px;border-bottom:1.5px dashed var(--line-2);
}
.cupom-topo span{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.linha{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding:3.5px 0;color:var(--ink-2)}
.linha b{color:var(--ink);font-weight:600}
.linha .val{white-space:nowrap;font-weight:600}
.linha-neg .val{color:var(--neg)}
.linha-nota{font-size:11px;color:var(--ink-3);font-family:var(--sans);padding-top:0;margin-top:-2px}
.regua{height:1.5px;background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 10px);margin:9px 0}
.linha-total{font-size:15px;padding-top:6px}
.linha-total b{font-weight:700}
.linha-total .val{font-size:21px;font-weight:700;letter-spacing:-.02em}
.val-pos{color:var(--pos)} .val-neg{color:var(--neg)}
.chips-cupom{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1.5px dashed var(--line-2)}
.chip{
  font-family:var(--sans);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.cupom-vazio{text-align:center;color:var(--ink-3);font-family:var(--sans);font-size:13px;padding:14px 8px;line-height:1.5}
.sugestao{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;
  border-top:1.5px dashed var(--line-2);font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
}
.sugestao input{
  width:56px;padding:4px 7px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);
  font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;
}
.sugestao .alvo{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px}

/* ---------- detalhes ---------- */
details.mais{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.mais summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
details.mais summary::-webkit-details-marker{display:none}
details.mais summary::before{content:"+";font-family:var(--mono);font-weight:700;color:var(--accent)}
details.mais[open] summary::before{content:"–"}
details.mais > div{margin-top:12px}

/* ---------- painel de venda / edicao ---------- */
.venda-alvo{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:15px;
}
.venda-alvo .nome{font-weight:660;font-size:15px;line-height:1.25}
.venda-alvo .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.venda-alvo .custo{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;color:var(--ink-2)}
.botoes-par{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:16px}
.sub-secao{
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:18px 0 12px;padding-top:14px;border-top:1px solid var(--line);
}

/* ---------- itens (a caminho / em estoque) ---------- */
.item{
  display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);
}
.item:last-of-type{border-bottom:none}
.item-nome{font-weight:620;line-height:1.3}
.item-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-meta .encalhe{color:var(--neg);font-weight:700}
.unidade{
  font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;white-space:nowrap;
}
.item-valor{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.item-acoes{display:flex;gap:5px;align-items:center}
.item-form{
  grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:2px;
}
.item-form label{font-size:12px;font-weight:600;color:var(--ink-2)}
.item-form input{
  padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:13.5px;
}
.item-form input[type=number]{width:76px;font-family:var(--mono);font-weight:700;text-align:center}
.item-form input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:519px){
  .item{grid-template-columns:1fr auto}
  .item-acoes{grid-column:1/-1;justify-content:flex-end;gap:7px}
}

/* ---------- resumo ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.tile .rot{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tile .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.tile .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.tile-destaque{background:var(--accent-soft);border-color:transparent}

.canal-linha{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.canal-linha:last-child{border-bottom:none}
.canal-nome{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.canal-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;white-space:nowrap}
.barra{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:1px}
.barra i{display:block;height:100%;border-radius:3px;background:var(--marca)}
.canal-meta{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- tabela ---------- */
.tabela-caixa{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  text-align:right;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:0 11px 9px;white-space:nowrap;border-bottom:1.5px solid var(--line-2);
}
thead th:first-child,tbody td:first-child{text-align:left}
tbody td{padding:11px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.num-cel{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prod{font-weight:620;color:var(--ink);line-height:1.3}
.prod small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.lucro-cel{font-weight:700}
.acoes-cel{display:flex;gap:2px;justify-content:flex-end}
.icone{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:34px;min-height:34px;
  background:none;border:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;
  padding:5px 7px;border-radius:8px;
}
.icone:hover{background:var(--surface-2);color:var(--ink)}
.icone-perigo:hover{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
/* confirmacao em dois toques: o iframe do artifact bloqueia confirm() nativo, que devolve
   false calado — o clique de apagar morria sem o usuario entender por que */
.icone.armado{
  min-width:auto;padding:0 12px;background:var(--neg);color:#fff;
  font-family:var(--sans);font-size:12px;font-weight:700;
}
.icone.armado:hover{background:var(--neg);filter:brightness(1.12);color:#fff}
/* no celular o dedo precisa de alvo maior — um destes botoes apaga o produto.
   precisa vir DEPOIS das regras base de .icone/.btn-mini, senao elas vencem no empate */
@media (pointer:coarse),(max-width:719px){
  .icone{min-width:42px;min-height:42px;font-size:18px}
  .btn-mini{min-height:42px;padding:9px 15px}

  // ---------- desenhar ----------
  function htmlCanais(nomeGrupo) {
    var h = '';
    for (var i = 0; i < DADOS.canais.length; i++) {
      var c = DADOS.canais[i];
      h += '<label class="canal" style="--marca:' + esc(c.cor) + ';--marca-txt:' + esc(c.fg) + '">'
        + '<input type="radio" name="' + nomeGrupo + '" value="' + esc(c.id) + '">'
        + '<span class="canal-face"><span class="ponto" style="background:' + esc(c.cor) + '"></span>' + esc(c.curto) + '</span></label>';
    }
    return h;
  }
  function desenharCanais() {
    $('#v-canais').innerHTML = htmlCanais('canal-venda');
    $('#ed-canais').innerHTML = htmlCanais('canal-edit');
    var rs = $('#v-canais').querySelectorAll('input');
    for (var j = 0; j < rs.length; j++) rs[j].addEventListener('change', desenharCupom);
  }
  function canalEscolhido() {
    var r = document.querySelector('#v-canais input:checked');
    return r ? canalDe(r.value) : null;
  }

  function desenharCupom() {
    var el = $('#cupom');
    var it = vendendo ? itemDe(vendendo) : null;
    if (!it) { el.innerHTML = ''; return; }
    var canal = canalEscolhido();
    var custo = num($('#v-custo-edit').value);
    var preco = num($('#v-preco').value);
    var freteTxt = $('#v-frete').value.trim();

    if (!canal || preco <= 0) {
      el.innerHTML = '<div class="cupom-vazio">' + (canal
        ? 'Digite por quanto o produto saiu e a conta aparece aqui.'
        : 'Escolha onde vendeu e digite o valor.<br>A taxa e o frete entram sozinhos.') + '</div>';
      return;
    }
    var c = conta(custo, preco, canal, freteTxt === '' ? null : num(freteTxt));
    var temFixa = preco < num(canal.limite) && num(canal.fixa) > 0;
    var auto = freteTxt === '';
    var h = '<div class="cupom-topo"><span>' + esc(canal.nome) + '</span><span>' + pc(num(canal.pct)) + ' de comissão</span></div>'
      + '<div class="linha"><b>Você recebe</b><span class="val">' + brl(preco) + '</span></div>'
      + '<div class="linha linha-neg"><span>Taxa do canal</span><span class="val">− ' + brl(c.taxa) + '</span></div>';
    // limite altissimo é como se marca "cobra sempre" — nao faz sentido mostrar o numero
    if (temFixa) {
      h += '<div class="linha linha-nota">' + (num(canal.limite) >= 100000
        ? 'inclui a tarifa fixa de ' + brl(num(canal.fixa)) + ' por item, que esse canal cobra em toda venda'
        : 'inclui tarifa fixa de ' + brl(num(canal.fixa)) + ', porque a venda ficou abaixo de ' + brl(num(canal.limite))) + '</div>';
    }
    h += '<div class="linha linha-neg"><span>Frete' + (auto ? '' : ' (você ajustou)') + '</span><span class="val">− ' + brl(c.frete) + '</span></div>';
    if (auto && c.frete > 0) h += '<div class="linha linha-nota">o frete é por sua conta acima de ' + brl(num(canal.freteMin)) + '</div>';
    if (auto && c.frete === 0 && num(canal.frete) > 0) h += '<div class="linha linha-nota">abaixo de ' + brl(num(canal.freteMin)) + ' quem paga o frete é o comprador</div>';
    h += '<div class="regua"></div>'
      + '<div class="linha"><span>Cai na sua conta</span><span class="val">' + brl(c.liquido) + '</span></div>'
      + '<div class="linha linha-neg"><span>O que o produto custou</span><span class="val">− ' + brl(c.custo) + '</span></div>'
      + '<div class="regua"></div>'
      + '<div class="linha linha-total"><b>' + (c.lucro < 0 ? 'Prejuízo' : 'Sobra pra você') + '</b>'
      + '<span class="val ' + (c.lucro < 0 ? 'val-neg' : 'val-pos') + '">' + brl(c.lucro) + '</span></div>';
    if (custo > 0) {
      h += '<div class="chips-cupom">'
        + '<span class="chip">margem <b>' + pc(c.margem) + '</b></span>'
        + '<span class="chip">retorno <b>' + pc(c.roi) + '</b></span>'
        + '<span class="chip">taxas <b>' + pc((c.taxa + c.frete) / preco) + '</b> da venda</span></div>';
      var alvoM = num($('#v-margem') ? $('#v-margem').value : 30) || 30;
      var pAlvo = precoAlvo(custo, canal, alvoM / 100);
      h += '<div class="sugestao">Para lucrar <input id="v-margem" type="number" min="1" max="90" step="1" value="' + alvoM + '" aria-label="margem desejada em %">% cobre <span class="alvo">' + (isFinite(pAlvo) ? brl(pAlvo) : '—') + '</span></div>';
    }
    el.innerHTML = h;
    var mi = $('#v-margem');
    if (mi) mi.addEventListener('input', desenharCupom);
  }

  // mostra o rateio ao vivo enquanto ele digita quantidade e valor total
  function desenharDicaEntrada() {
    var qtd = Math.max(1, Math.round(num($('#e-qtd').value) || 1));
    var total = num($('#e-custo').value);
    $('#e-custo-rot').textContent = qtd > 1 ? 'Quanto custou no total' : 'Quanto custou';
    var d = $('#e-dica');
    if (qtd > 1 && total > 0) {
      var f = ratear(total, qtd);
      var iguais = f[0] === f[f.length - 1];
      d.innerHTML = '<span>↳</span><span>Vira <b>' + qtd + '</b> unidades separadas de <b>' + brl(f[0]) + '</b> cada'
        + (iguais ? '' : ', com algumas de <b>' + brl(f[f.length - 1]) + '</b> pra fechar o total exato') + '.</span>';
      d.hidden = false;
    } else if (qtd > 1) {
      d.innerHTML = '<span>↳</span><span>Vira <b>' + qtd + '</b> unidades separadas. Digite o valor <b>total</b> pago que eu divido.</span>';
      d.hidden = false;
    } else {
      d.hidden = true;
    }
  }

  function desenharTiles() {
    var vend = porFase('vendido'), est = porFase('estoque'), cam = porFase('caminho');
    var fat = 0, lucro = 0, taxas = 0, parado = 0, investido = 0;
    var i, c;
    for (i = 0; i < vend.length; i++) {
      c = contaDoItem(vend[i]);
      fat += c.preco; lucro += c.lucro; taxas += c.taxa + c.frete; investido += c.custo;
    }
    for (i = 0; i < est.length; i++) { parado += num(est[i].custo); investido += num(est[i].custo); }
    for (i = 0; i < cam.length; i++) { parado += num(cam[i].custo); investido += num(cam[i].custo); }

    var t = [
      { r: 'Sobrou no total', n: brl(lucro), s: plural(vend.length, 'venda', 'vendas'), d: true, cor: lucro < 0 ? 'var(--neg)' : 'var(--pos)' },
      { r: 'Dinheiro parado', n: brl(parado), s: plural(est.length + cam.length, 'produto sem vender', 'produtos sem vender'), cor: parado > 0 ? 'var(--warn)' : '' },
      { r: 'Faturamento', n: brl(fat), s: 'entrou bruto' },
      { r: 'Margem média', n: fat > 0 ? pc(lucro / fat) : '—', s: 'do que entra, sobra isso' },
      { r: 'Taxas e frete', n: brl(taxas), s: fat > 0 ? pc(taxas / fat) + ' do faturamento' : 'nada ainda' },
      { r: 'Investido', n: brl(investido), s: 'custo de tudo que comprou' }
    ];
    var h = '';
    for (var k = 0; k < t.length; k++) {
      h += '<div class="tile' + (t[k].d ? ' tile-destaque' : '') + '"><div class="rot">' + t[k].r + '</div>'
        + '<div class="num"' + (t[k].cor ? ' style="color:' + t[k].cor + '"' : '') + '>' + t[k].n + '</div>'
        + '<div class="sub">' + t[k].s + '</div></div>';
    }
    $('#tiles').innerHTML = h;
  }

    if (!itens.length) { $('#lista-caminho').innerHTML = ''; return; }
    itens.sort(function (a, b) { return (a.dCompra || '').localeCompare(b.dCompra || ''); });
    var h = '';

      if (it.dCompra) meta.push('comprado ' + dataBR(it.dCompra));

      h += '<div class="item"><div><div class="item-nome">' + esc(it.produto) + '</div>'
        + '<div class="item-meta">' + selo(it) + '<span>' + meta.join(' · ') + '</span></div></div>'

    var h = '';
    for (var j = 0; j < arr.length; j++) {

  // ---------- projecao ----------
  // agrupa o que AINDA NAO foi vendido por nome de produto: 7 unidades iguais viram
  // uma linha so, com um preco previsto que vale para todas
  var GRUPOS = [];

  function gruposProjecao() {
    var mapa = {}, ordem = [];
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i];
      if (fase(it) === 'vendido') continue;
      var k = String(it.produto || '(sem nome)').trim().toLowerCase();
      if (!mapa[k]) { mapa[k] = { nome: it.produto || '(sem nome)', itens: [], custo: 0 }; ordem.push(k); }
      mapa[k].itens.push(it);
      mapa[k].custo += num(it.custo);
    }
    var r = [];
    for (var j = 0; j < ordem.length; j++) r.push(mapa[ordem[j]]);
    return r;
  }
  function canalPadrao() {
    // o canal que ele mais usou de verdade; sem historico, o primeiro da lista
    var cont = {}, melhor = '', max = 0;
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i];
      if (!it.dVenda || !it.canal) continue;
      cont[it.canal] = (cont[it.canal] || 0) + 1;
      if (cont[it.canal] > max) { max = cont[it.canal]; melhor = it.canal; }
    }
    return melhor || (DADOS.canais[0] ? DADOS.canais[0].id : '');
  }
  function alvoDoGrupo(g) {
    for (var i = 0; i < g.itens.length; i++) if (num(g.itens[i].alvo) > 0) return num(g.itens[i].alvo);
    return 0;
  }
  function canalDoGrupo(g) {
    for (var i = 0; i < g.itens.length; i++) if (g.itens[i].alvoCanal) return g.itens[i].alvoCanal;
    return canalPadrao();
  }

  function desenharProjecao() {
    GRUPOS = gruposProjecao();
    $('#sec-projecao').hidden = GRUPOS.length === 0;
    if (!GRUPOS.length) { $('#proj-lista').innerHTML = ''; $('#proj-totais').innerHTML = ''; return; }
    var unidades = 0;
    for (var u = 0; u < GRUPOS.length; u++) unidades += GRUPOS[u].itens.length;
    $('#conta-proj').textContent = plural(unidades, 'produto', 'produtos');

    var h = '';
    for (var i = 0; i < GRUPOS.length; i++) {
      var g = GRUPOS[i], fases = {};
      for (var j = 0; j < g.itens.length; j++) fases[fase(g.itens[j])] = 1;
      var onde = fases.caminho && fases.estoque ? 'parte a caminho, parte em estoque'
        : (fases.caminho ? 'a caminho' : 'em estoque');
      var sel = canalDoGrupo(g), opts = '';
      for (var k = 0; k < DADOS.canais.length; k++) {
        var c = DADOS.canais[k];
        opts += '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.curto) + '</option>';
      }
      var alvo = alvoDoGrupo(g);
      h += '<div class="proj-item">'
        + '<div class="proj-id"><div class="item-nome">' + esc(g.nome) + '</div>'
        + '<div class="item-meta"><span>' + plural(g.itens.length, 'unidade', 'unidades') + ' · custo ' + brl(g.custo) + ' · ' + onde + '</span></div></div>'
        + '<select class="proj-canal" data-g="' + i + '" aria-label="Canal previsto para ' + esc(g.nome) + '">' + opts + '</select>'
        + '<div class="com-prefixo"><span class="prefixo">R$</span>'
        + '<input class="entrada entrada-dinheiro proj-preco" data-g="' + i + '" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"'
        + ' aria-label="Preço previsto por unidade de ' + esc(g.nome) + '" value="' + (alvo > 0 ? paraCampo(alvo) : '') + '"></div>'
        + '<div class="proj-res" id="proj-res-' + i + '"></div></div>';
    }
    $('#proj-lista').innerHTML = h;
    var campos = $('#proj-lista').querySelectorAll('.proj-preco, .proj-canal');
    for (var m = 0; m < campos.length; m++) {
      campos[m].addEventListener('input', recalcProjecao);
      campos[m].addEventListener('change', recalcProjecao);
    }
    recalcProjecao();
  }

  function recalcProjecao() {
    var fat = 0, taxas = 0, custo = 0, lucro = 0, semPreco = 0;
    for (var i = 0; i < GRUPOS.length; i++) {
      var g = GRUPOS[i];
      var inp = document.querySelector('.proj-preco[data-g="' + i + '"]');
      var sel = document.querySelector('.proj-canal[data-g="' + i + '"]');
      var res = document.getElementById('proj-res-' + i);
      var preco = inp ? num(inp.value) : 0;
      var canal = sel ? canalDe(sel.value) : null;
      if (preco <= 0 || !canal) {
        semPreco++;
        if (res) res.innerHTML = '<span class="proj-vazio">defina o preço</span>';
        continue;
      }
      var gFat = 0, gTaxa = 0, gLucro = 0;
      for (var j = 0; j < g.itens.length; j++) {
        var c = conta(num(g.itens[j].custo), preco, canal, null);
        gFat += c.preco; gTaxa += c.taxa + c.frete; gLucro += c.lucro;
      }
      fat += gFat; taxas += gTaxa; custo += g.custo; lucro += gLucro;
      if (res) {
        res.innerHTML = '<div class="proj-lucro" style="color:' + (gLucro < 0 ? 'var(--neg)' : 'var(--pos)') + '">' + brl(gLucro) + '</div>'
          + '<div class="proj-sub">' + brl(gLucro / g.itens.length) + ' por unidade · margem ' + pc(gFat > 0 ? gLucro / gFat : NaN) + '</div>';
      }
    }

    var realizado = 0, vend = porFase('vendido');
    for (var v = 0; v < vend.length; v++) realizado += contaDoItem(vend[v]).lucro;

    // arredonda para centavos ANTES de exibir e somar: senao as parcelas na tela
    // nao fecham com o total, e a conta toda parece errada mesmo estando certa
    var c2 = function (x) { return Math.round(x * 100) / 100; };
    fat = c2(fat); taxas = c2(taxas); custo = c2(custo); realizado = c2(realizado);
    lucro = c2(fat - taxas - custo);

    var t = '';
    if (fat > 0) {
      t += '<div class="proj-caixa">'
        + '<div class="proj-linha"><span>Faturamento projetado</span><span class="v">' + brl(fat) + '</span></div>'
        + '<div class="proj-linha neg"><span>(−) Taxas e frete</span><span class="v">− ' + brl(taxas) + '</span></div>'
        + '<div class="proj-linha neg"><span>(−) Custo dos produtos</span><span class="v">− ' + brl(custo) + '</span></div>'
        + '<div class="regua"></div>'
        + '<div class="proj-linha destaque"><b>Lucro projetado</b><span class="v" style="color:' + (lucro < 0 ? 'var(--neg)' : 'var(--pos)') + '">' + brl(lucro) + '</span></div>'
        + '<div class="proj-linha"><span>margem projetada</span><span class="v">' + pc(fat > 0 ? lucro / fat : NaN) + '</span></div>'
        + '</div>';
    }
    if (semPreco > 0) {
      t += '<div class="proj-alerta">' + (semPreco === 1
        ? '1 produto ainda está sem preço previsto e não entrou na conta.'
        : semPreco + ' produtos ainda estão sem preço previsto e não entraram na conta.') + '</div>';
    }
    if (fat > 0) {
      t += '<div class="proj-somatorio">Vendendo tudo pelo preço previsto, o lucro do negócio sairia de <b>' + brl(realizado)
        + '</b> (o que você já realizou) para <b>' + brl(realizado + lucro) + '</b>.</div>';
    }
    $('#proj-totais').innerHTML = t;
  }

  // preenche so os campos vazios, mirando a margem que ele digitou
  function sugerirPrecos() {
    var alvoM = num($('#proj-margem').value) || 30;
    if (alvoM < 1 || alvoM > 90) { erro('<b>Margem inválida.</b> Use um número entre 1 e 90.'); return; }
    $('#aviso-erro').hidden = true;
    for (var i = 0; i < GRUPOS.length; i++) {
      var inp = document.querySelector('.proj-preco[data-g="' + i + '"]');
      var sel = document.querySelector('.proj-canal[data-g="' + i + '"]');
      if (!inp || num(inp.value) > 0) continue;
      var canal = sel ? canalDe(sel.value) : null;
      // usa o custo medio do grupo como base do preco sugerido
      var medio = GRUPOS[i].custo / GRUPOS[i].itens.length;
      var sugerido = precoAlvo(medio, canal, alvoM / 100);
      if (isFinite(sugerido)) inp.value = paraCampo(sugerido);
    }
    recalcProjecao();
  }

  function salvarProjecao() {
    if (salvando) return;
    $('#aviso-erro').hidden = true;
    var antes = [];
    for (var a = 0; a < DADOS.itens.length; a++) antes.push({ alvo: DADOS.itens[a].alvo, alvoCanal: DADOS.itens[a].alvoCanal });
    for (var i = 0; i < GRUPOS.length; i++) {
      var inp = document.querySelector('.proj-preco[data-g="' + i + '"]');
      var sel = document.querySelector('.proj-canal[data-g="' + i + '"]');
      var preco = inp ? num(inp.value) : 0;
      var canal = sel ? sel.value : '';
      for (var j = 0; j < GRUPOS[i].itens.length; j++) {
        GRUPOS[i].itens[j].alvo = preco > 0 ? preco : 0;
        GRUPOS[i].itens[j].alvoCanal = canal;
      }
    }
    persistir($('#btn-proj-salvar'), 'Salvar projeção', function () {
      for (var b = 0; b < DADOS.itens.length && b < antes.length; b++) {
        DADOS.itens[b].alvo = antes[b].alvo;
        DADOS.itens[b].alvoCanal = antes[b].alvoCanal;
      }
      desenharProjecao();
    });
  }

  function trocarAba(id) {
    if (PESSOA && PESSOA.id === id) return;
    ativar(id);
    fecharPaineis();
    $('#aviso-erro').hidden = true;
    limparEntrada();
    desenharCanais(); desenharAjustes(); desenharTudo();
    // busca o que a outra pessoa registrou desde que a pagina abriu
    carregarDoBanco().then(function () {
      ativar(id);
      desenharCanais(); desenharAjustes(); desenharTudo();
    }).catch(function () {});
  }

  function desenharLoginQuem() { /* o login agora e por e-mail; nada a desenhar */ }

  function tentarEntrar() {
    if (!configurado()) {
      $('#login-erro').textContent = 'O app ainda não foi ligado ao banco.';
      return;
    }
    var email = $('#login-email').value.trim();
    var senha = $('#login-senha').value;
    if (!email || !senha) { $('#login-erro').textContent = 'Preencha e-mail e senha.'; return; }
    var btn = $('#btn-entrar');
    btn.disabled = true; btn.innerHTML = '<span class="salvando"></span> Entrando…';
    $('#login-erro').textContent = '';
    autenticar({ email: email, password: senha }, 'password')
      .then(function () { return carregarDoBanco(); })
      .then(function () {
        btn.disabled = false; btn.textContent = 'Entrar';
        $('#login-senha').value = '';
        abrirApp();
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Entrar';
        $('#login-senha').value = '';
        guardarSessao(null);
        if (e && e.status === 400) $('#login-erro').textContent = 'E-mail ou senha errados.';

  // no artifact o download tem que passar pela capability (o sandbox bloqueia <a download>);
  // fora dele, o jeito normal do navegador funciona
  function baixarArquivo(nome, texto, tipo) {
    return new Promise(function (resolve, reject) {
      try {
        var b = new Blob([texto], { type: tipo || 'text/plain;charset=utf-8' });
        var u = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = u; a.download = nome;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 0);
        resolve();
      } catch (e) { reject(e); }
    });
  }

      erro('<b>Esse texto não é um backup válido.</b> Copie o arquivo inteiro, do primeiro ao último caractere.');
      return;
    }
    // aceita backup novo (com abas) e backup antigo (uma pessoa so)
    if (novo && Array.isArray(novo.itens) && Array.isArray(novo.canais) && !novo.pessoas) {
      novo = { v: 4, pessoas: [
        { id: 'victor', nome: 'Victor', canais: novo.canais, itens: novo.itens },

      erro('<b>Esse arquivo não parece um backup do Quanto Sobrou.</b> Não achei as abas nem os produtos.');

  // confirmacao em dois toques. NAO usar window.confirm: dentro do iframe do artifact
  // ele devolve false sem abrir nada, e a acao morre em silencio.
  function desarmar(b) {
    clearTimeout(+b.getAttribute("data-timer"));
    if (b.getAttribute("data-original") !== null) b.innerHTML = b.getAttribute("data-original");
    b.removeAttribute("data-armado");
    b.classList.remove("armado");
    if (b.getAttribute("data-rotulo") !== null) b.setAttribute("aria-label", b.getAttribute("data-rotulo"));
  }
  function doisToques(botao, rotulo, aoConfirmar) {
    if (botao.getAttribute("data-armado")) { desarmar(botao); aoConfirmar(); return; }
    var outros = document.querySelectorAll("[data-armado]");
    for (var i = 0; i < outros.length; i++) desarmar(outros[i]);
    botao.setAttribute("data-original", botao.innerHTML);
    botao.setAttribute("data-rotulo", botao.getAttribute("aria-label") || "");
    botao.setAttribute("data-armado", "1");
    botao.classList.add("armado");
    botao.innerHTML = rotulo;
    botao.setAttribute("aria-label", rotulo + " " + (botao.getAttribute("data-rotulo") || ""));
    botao.setAttribute("data-timer", setTimeout(function () { desarmar(botao); }, 5000));
  }

  function persistir(botao, textoOriginal, aoFalhar, aoSucesso) {
    if (!podeEditar()) {
      if (aoFalhar) aoFalhar();
      erro('<b>Essa aba não é sua.</b> Só ' + esc(PESSOA ? PESSOA.nome : 'o dono') + ' pode alterar os dados dela.');
      return;
    }
    salvando = true;
    if (botao) { botao.disabled = true; botao.innerHTML = '<span class="salvando"></span> Salvando…'; }
    gravarPessoa().then(function () {
      salvando = false;
      if (botao) { botao.disabled = false; botao.innerHTML = textoOriginal; }
      if (aoSucesso) aoSucesso();
    }).catch(function (e) {
      salvando = false;
      if (botao) { botao.disabled = false; botao.innerHTML = textoOriginal; }
      if (aoFalhar) aoFalhar();
      var t = (e && e.tipo) || 'rede';
      if (t === 'sem-sessao') {
        erro('<b>Sua sessão expirou.</b> Entre de novo para continuar.');
        setTimeout(sair, 1200);
      } else if (t === 'permissao') {
        erro('<b>O banco recusou a alteração.</b> Essa aba não é sua.');
      } else {
        erro('<b>Não deu pra salvar.</b> Verifique a conexão e tente de novo — o que você digitou não foi perdido.');
      }
    });
  }

    for (var i = 0; i < qtd; i++) {
      novos.push({

        dCompra: dCompra, dChegada: chegou, grupo: grupo,
        canal: '', preco: 0, frete: null, dVenda: ''
      });

      sessionStorage.setItem('qs-pendente', JSON.stringify({
        produto: nome, custo: total, qtd: qtd, fornecedor: fornecedor, dCompra: dCompra, dChegada: chegou
      }));

    for (var j = 0; j < novos.length; j++) DADOS.itens.push(novos[j]);

  function salvarEdicao() {
    if (salvando) return;
    $('#aviso-erro').hidden = true;
    var it = itemDe(editando); if (!it) return;
    var nome = $('#ed-produto').value.trim();
    if (!nome) { erro('<b>Falta o nome do produto.</b>'); $('#ed-produto').focus(); return; }
    var custo = num($('#ed-custo').value);
    if (custo <= 0) { erro('<b>Falta o custo.</b> Digite quanto esta unidade custou.'); $('#ed-custo').focus(); return; }
    var dCompra = $('#ed-dcompra').value || '';
    var dChegada = $('#ed-dchegada').value || '';
    if (dCompra && dChegada && dChegada < dCompra) {
      erro('<b>A chegada não pode ser antes da compra.</b> Comprado em ' + dataBR(dCompra) + '.');
      return;
    }
    var vendido = fase(it) === 'vendido';
    var canal = it.canal, preco = it.preco, frete = it.frete, dVenda = it.dVenda;
    if (vendido) {
      var r = document.querySelector('#ed-canais input:checked');
      if (!r) { erro('<b>Falta o canal da venda.</b>'); return; }
      canal = r.value;
      preco = num($('#ed-preco').value);
      if (preco <= 0) { erro('<b>Falta o valor da venda.</b>'); $('#ed-preco').focus(); return; }
      dVenda = $('#ed-dvenda').value || '';
      if (!dVenda) { erro('<b>Falta a data da saída.</b>'); $('#ed-dvenda').focus(); return; }
      if (dChegada && dVenda < dChegada) {
        erro('<b>A saída não pode ser antes da chegada.</b> Chegou em ' + dataBR(dChegada) + '.');
        return;
      }
      var ft = $('#ed-frete').value.trim();
      frete = ft === '' ? null : num(ft);
    }

    var antes = {
      produto: it.produto, custo: it.custo, fornecedor: it.fornecedor, dCompra: it.dCompra,
      dChegada: it.dChegada, canal: it.canal, preco: it.preco, frete: it.frete, dVenda: it.dVenda
    };
    it.produto = nome; it.custo = custo; it.fornecedor = $('#ed-fornecedor').value.trim();
    it.dCompra = dCompra; it.dChegada = dChegada;
    it.canal = canal; it.preco = preco; it.frete = frete; it.dVenda = dVenda;
    fecharPaineis();
    desenharTudo();
    persistir($('#btn-entrada'), 'Dar entrada', function () {
      for (var k in antes) if (Object.prototype.hasOwnProperty.call(antes, k)) it[k] = antes[k];
      desenharTudo();
    });
  }

  function aoBaixar() {
    var linhas = [['Produto', 'Unidade', 'Situação', 'Onde comprou', 'Canal de venda', 'Data compra', 'Data chegada', 'Data saída',
      'Dias a caminho', 'Dias parado', 'Custo', 'Preço previsto', 'Venda', 'Taxa', 'Frete', 'Sobrou', 'Margem %', 'Retorno %']];
    var nomes = { caminho: 'A caminho', estoque: 'Em estoque', vendido: 'Vendido' };

    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i], f = fase(it), cn = canalDe(it.canal), c = contaDoItem(it);
      var g = grupoDe(it);
      var dCam = dias(it.dCompra, it.dChegada || null);
      var dPar = it.dChegada ? dias(it.dChegada, it.dVenda || null) : null;
      linhas.push([
        it.produto || '', g ? g.idx + ' de ' + g.total : '', nomes[f], it.fornecedor || '', cn ? cn.nome : '',
        dataBR(it.dCompra), dataBR(it.dChegada), dataBR(it.dVenda),
        dCam == null ? '' : dCam, dPar == null ? '' : dPar,
        dec(num(it.custo)),
        f !== 'vendido' && num(it.alvo) > 0 ? dec(num(it.alvo)) : '',
        f === 'vendido' ? dec(c.preco) : '', f === 'vendido' ? dec(c.taxa) : '',
        f === 'vendido' ? dec(c.frete) : '', f === 'vendido' ? dec(c.lucro) : '',
        f === 'vendido' && isFinite(c.margem) ? (c.margem * 100).toFixed(1).replace('.', ',') : '',
        f === 'vendido' && isFinite(c.roi) ? (c.roi * 100).toFixed(1).replace('.', ',') : ''
      ]);
    }
    var csv = linhas.map(function (l) {
      return l.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');

    var btn = $('#btn-csv');
    btn.disabled = true;
    baixarArquivo('quanto-sobrou-' + (PESSOA ? PESSOA.id : 'dados') + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8')
      .then(function () { btn.disabled = false; })
      .catch(function () {
        btn.disabled = false;
        erro('<b>O download não foi concluído.</b> Ou você cancelou, ou esta visualização não permite baixar arquivos.');
      });
  }

  // ---------- eventos das linhas (redesenhadas a cada mudanca) ----------
  function ligarBotoesDeItem() {
    var liga = function (attr, fn) {
      var bs = document.querySelectorAll('[' + attr + ']');
      for (var i = 0; i < bs.length; i++) {
        (function (b) { b.addEventListener('click', function () { fn(b.getAttribute(attr), b); }); })(bs[i]);
      }
    };
    liga('data-chegou', abrirChegada);
    liga('data-confirma-chegada', confirmarChegada);
    liga('data-cancela-chegada', function (id) { var f = document.getElementById('form-chegada-' + id); if (f) f.hidden = true; });
    liga('data-vender', abrirVenda);
    liga('data-voltar', desfazerChegada);
    liga('data-devolver', function (id, b) { doisToques(b, 'Desfazer?', function () { desfazerVenda(id); }); });
    liga('data-editar', abrirEdicao);
    liga('data-duplicar', abrirDuplicar);
    liga('data-confirma-dup', confirmarDuplicar);
    liga('data-cancela-dup', function (id) { var f = document.getElementById('form-dup-' + id); if (f) f.hidden = true; });
    liga('data-apagar', function (id, b) { doisToques(b, 'Apagar?', function () { apagarItem(id); }); });
  }

  // ---------- ligar tudo ----------
  document.getElementById('root').innerHTML = SHELL;
  if (!DADOS.pessoas || !DADOS.pessoas.length) {
    DADOS.pessoas = [{ id: 'vazio', nome: '—', dono: null, canais: [], itens: [] }];
  }
  ativar(DADOS.pessoas[0].id);
  desenharCanais();
  desenharAjustes();
  desenharTudo();
  $('#e-dcompra').value = hoje();
  desenharDicaEntrada();

  ['v-preco', 'v-frete', 'v-custo-edit'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', desenharCupom);
  });
  ['e-qtd', 'e-custo'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', desenharDicaEntrada);
  });
  $('#btn-entrada').addEventListener('click', aoDarEntrada);
  $('#btn-venda').addEventListener('click', confirmarVenda);
  $('#btn-cancelar-venda').addEventListener('click', fecharPaineis);
  $('#btn-editar-salvar').addEventListener('click', salvarEdicao);
  $('#btn-editar-cancelar').addEventListener('click', fecharPaineis);
  $('#btn-taxas').addEventListener('click', aoSalvarTaxas);
  $('#btn-proj-sugerir').addEventListener('click', sugerirPrecos);
  $('#btn-proj-salvar').addEventListener('click', salvarProjecao);
  $('#btn-csv').addEventListener('click', aoBaixar);
  $('#btn-entrar').addEventListener('click', tentarEntrar);
  $('#login-senha').addEventListener('keydown', function (e) { if (e.key === 'Enter') tentarEntrar(); });
  $('#btn-backup').addEventListener('click', aoBackup);
  $('#btn-restaurar').addEventListener('click', aoRestaurar);
  $('#e-produto').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#e-custo').focus(); });
  $('#e-custo').addEventListener('keydown', function (e) { if (e.key === 'Enter') aoDarEntrada(); });

  // devolve ao formulario uma entrada que nao chegou a ser salva
  try {
    var pend = sessionStorage.getItem('qs-pendente');
    if (pend) {
      sessionStorage.removeItem('qs-pendente');
      var p = JSON.parse(pend);
      $('#e-produto').value = p.produto || '';
      if (p.custo) $('#e-custo').value = String(p.custo).replace('.', ',');
      $('#e-qtd').value = p.qtd || 1;
      $('#e-fornecedor').value = p.fornecedor || '';
      $('#e-dcompra').value = p.dCompra || hoje();
      $('#e-jachegou').checked = !!p.dChegada;
      $('#aviso-pendente').hidden = false;
      desenharDicaEntrada();
    }
  } catch (e) {}

  if (!configurado()) {
    $('#login-erro').innerHTML = 'Este app ainda não foi ligado ao banco de dados.';
    $('#btn-entrar').disabled = true;
  } else {
    try {
      var guardada = localStorage.getItem(CHAVE_SESSAO);
      if (guardada) {
        SESSAO = JSON.parse(guardada);
        carregarDoBanco().then(abrirApp).catch(function () { guardarSessao(null); });
      }
    } catch (e) { guardarSessao(null); }
  }


})();
</script>
