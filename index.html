<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quanto Sobrou</title>

<style id="css">
*,*::before,*::after{box-sizing:border-box}
html,body,h1,h2,h3,p,ul,ol,li,figure,table,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
img{max-width:100%}

:root{
  /* sem isto o navegador trata a pagina como "so clara" e escurece tudo por conta propria */
  color-scheme:light;
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#ECF0EE; --line:#DBE2DF; --line-2:#C6D0CC;
  --ink:#111917; --ink-2:#4A5551; --ink-3:#5C6662;
  --accent:#0B6B5F; --accent-ink:#FFFFFF; --accent-soft:#DBEDE8;
  --pos:#136B38; --neg:#A81E27; --warn:#845804;
  --cupom:#FBFCFB;
  --shadow:0 1px 2px rgba(17,25,23,.05), 0 10px 28px -16px rgba(17,25,23,.22);
  --sans:ui-sans-serif,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono","Roboto Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1211; --surface:#151D1B; --surface-2:#1D2725; --line:#293432; --line-2:#3A4744;
    --ink:#E5EDEA; --ink-2:#A1ADA9; --ink-3:#99A39E;
    --accent:#3FC3AA; --accent-ink:#05221D; --accent-soft:#123330;
    --pos:#4FCC7C; --neg:#F0787E; --warn:#DFA73B;
    --cupom:#192220;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1211; --surface:#151D1B; --surface-2:#1D2725; --line:#293432; --line-2:#3A4744;
  --ink:#E5EDEA; --ink-2:#A1ADA9; --ink-3:#99A39E;
  --accent:#3FC3AA; --accent-ink:#05221D; --accent-soft:#123330;
  --pos:#4FCC7C; --neg:#F0787E; --warn:#DFA73B;
  --cupom:#192220;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.7);
}

body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;padding-bottom:60px}

/* ---------- barra do sistema ---------- */
.topo-sistema{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 24px;background:var(--surface);border-bottom:1px solid var(--line);
}
.topo-sistema .marca-min{font-size:16.5px;font-weight:740;letter-spacing:-.022em;white-space:nowrap}
.topo-sistema .espaco{flex:1}

/* ---------- abas dos modulos ---------- */
.modulos{
  display:flex;gap:2px;padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto;
}
.modulo-aba{
  border:none;background:none;cursor:pointer;white-space:nowrap;
  padding:13px 17px 11px;font-size:14px;font-weight:620;color:var(--ink-3);
  border-bottom:2.5px solid transparent;transition:color .13s,border-color .13s;
}
.modulo-aba:hover{color:var(--ink)}
.modulo-aba[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.modulo-aba .badge{
  display:inline-block;margin-left:7px;font-family:var(--mono);font-size:10.5px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 6px;color:var(--ink-2);
}
.modulo-aba[aria-selected="true"] .badge{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.area{padding:20px 24px 0}

/* ---------- navegacao de baixo (so no celular) ---------- */
.nav-baixo{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -2px 14px -8px rgba(0,0,0,.28);
}
.nav-item{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:none;background:none;cursor:pointer;padding:5px 2px;
  color:var(--ink-3);font-size:10.5px;font-weight:640;font-family:var(--sans);
  min-height:52px;-webkit-tap-highlight-color:transparent;
}
.nav-icone{
  display:flex;align-items:center;justify-content:center;width:40px;height:25px;border-radius:13px;
  transition:background .13s;
}
.nav-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item[aria-selected="true"]{color:var(--accent)}
.nav-item[aria-selected="true"] .nav-icone{background:var(--accent-soft)}
.nav-ponto{
  position:absolute;top:3px;right:calc(50% - 20px);
  min-width:16px;height:16px;border-radius:9px;background:var(--neg);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:700;line-height:16px;text-align:center;padding:0 4px;
}
.modulo[hidden]{display:none}
.tit{font-size:19px;font-weight:700;letter-spacing:-.022em;margin-bottom:3px}
.tit-sub{font-size:13px;color:var(--ink-2);margin-bottom:18px;max-width:74ch}

/* ---------- colunas ---------- */
.colunas{display:grid;gap:18px;align-items:start}
.col-2{grid-template-columns:1fr 1fr}
.col-form{grid-template-columns:minmax(290px,350px) 1fr}
.col-graf{grid-template-columns:2fr 1fr}
@media (max-width:1100px){ .col-2,.col-form,.col-graf{grid-template-columns:1fr} }


/* ---------- grafico ---------- */
.graf-caixa{padding:4px 2px 0}
.graf svg{display:block;max-width:100%;height:auto;overflow:visible}
.graf .eixo{stroke:var(--line-2);stroke-width:1}
.graf .grade-linha{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.graf .rotulo{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.graf .valor-topo{font-family:var(--mono);font-size:10.5px;font-weight:700;fill:var(--ink-2)}
.graf .barra-dia{fill:var(--accent);transition:opacity .12s}
.graf .barra-dia:hover{opacity:.75}
.graf-vazio{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.graf-legenda{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.graf-legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:-1px}

/* ---------- caixa ---------- */
.dinheiro-linha{
  display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.dinheiro-linha:last-of-type{border-bottom:none}
.dinheiro-nome{font-weight:620;line-height:1.3}
.dinheiro-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dinheiro-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
.selo-espera{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);
  border-radius:20px;padding:2px 9px;white-space:nowrap;
}
.selo-caiu{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos);
  border-radius:20px;padding:2px 9px;white-space:nowrap;
}
@media (max-width:719px){
  .dinheiro-linha{grid-template-columns:1fr auto}
  .dinheiro-linha .item-acoes{grid-column:1/-1;justify-content:flex-end}
}

/* ---------- cabecalho ---------- */
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.marca h1{font-size:clamp(26px,4.4vw,36px);font-weight:760;letter-spacing:-.028em;line-height:1.05;text-wrap:balance}
.marca p{color:var(--ink-2);font-size:13.5px;margin-top:5px;max-width:56ch}
.topo-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;
  font-size:13.5px;font-weight:560;cursor:pointer;transition:background .13s,border-color .13s,transform .06s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-forte{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:640}
.btn-forte:hover{background:var(--accent);filter:brightness(1.08);border-color:var(--accent)}
.btn-larg{width:100%;padding:13px;font-size:15px}
.btn-mini{padding:7px 12px;font-size:12.5px;white-space:nowrap}
.btn-fantasma{background:none;border-color:transparent;color:var(--ink-3)}
.btn-fantasma:hover{background:var(--surface-2);border-color:var(--line-2);color:var(--ink)}
:where(a,button,input,label,summary):focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- entrada ---------- */
.login-tela{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);
}
.login-caixa{
  width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);padding:26px 24px;
}
.login-caixa h2{font-size:20px;font-weight:720;letter-spacing:-.02em;margin-bottom:4px}
.login-caixa p{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
.login-quem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.login-quem button{
  padding:13px 10px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;
  font-size:15px;font-weight:640;cursor:pointer;color:var(--ink);min-height:48px;
  transition:background .13s,border-color .13s,color .13s;
}
.login-quem button:hover{border-color:var(--ink-3)}
.login-quem button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.login-erro{font-size:12.5px;color:var(--neg);font-weight:600;margin-top:10px;line-height:1.45;min-height:1px}
.sessao{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;
}
.sessao b{color:var(--ink);font-weight:640}
.sessao button{
  border:none;background:none;cursor:pointer;color:var(--ink-3);font-size:12px;font-weight:600;
  padding:4px 9px;border-radius:14px;
}
.sessao button:hover{background:var(--surface);color:var(--ink)}
.aviso-alheio{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13px;
  line-height:1.45;margin-bottom:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.aviso-alheio b{color:var(--ink);font-weight:640}

/* ---------- abas ---------- */
/* fica dentro do cabecalho do sistema, entao nao carrega margem propria */
.abas{
  display:flex;gap:6px;padding:5px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);width:fit-content;max-width:100%;flex-wrap:wrap;
}
.aba{
  display:inline-flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;
  padding:9px 16px;border-radius:9px;font-size:14px;font-weight:620;color:var(--ink-2);
  transition:background .13s,color .13s;min-height:40px;
}
.aba:hover{background:var(--surface);color:var(--ink)}
.aba[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.aba[aria-selected="true"]:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.06)}
.aba-n{
  font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);
}
.aba[aria-selected="true"] .aba-n{background:rgba(0,0,0,.18);color:var(--accent-ink);border-color:transparent}
@media (pointer:coarse),(max-width:719px){ .aba{min-height:44px;padding:10px 18px} }

/* ---------- avisos ---------- */
.aviso{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;
  font-size:13px;line-height:1.45;margin-bottom:16px;border:1px solid;
}
.aviso b{font-weight:640}
.aviso-info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.aviso-alerta{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 34%,transparent);color:var(--ink)}
.aviso-erro{background:color-mix(in srgb,var(--neg) 12%,var(--surface));border-color:color-mix(in srgb,var(--neg) 34%,transparent);color:var(--ink)}
[hidden]{display:none !important}

/* ---------- grade ---------- */
.grade{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:980px){ .grade{grid-template-columns:minmax(360px,410px) 1fr;gap:26px} .coluna-esq{position:sticky;top:20px} }

.cartao{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.cartao:last-child{margin-bottom:0}
.cartao-corpo{padding:18px}
.rotulo-secao{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:12px;
}
.conta{
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0;
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;color:var(--ink-2);
}

/* ---------- formulario ---------- */
.campo{margin-bottom:15px}
.campo:last-child{margin-bottom:0}
.campo label,.campo .rot{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.entrada{
  width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:9px;
  padding:11px 12px;font-size:15px;transition:border-color .13s,background .13s;
}
.entrada:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.entrada::placeholder{color:var(--ink-3)}
.entrada-dinheiro{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.qtd-custo{display:grid;grid-template-columns:88px 1fr;gap:11px}
.com-prefixo{position:relative}
.com-prefixo .prefixo{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:13px;color:var(--ink-3);pointer-events:none;font-weight:600;
}
.com-prefixo .entrada{padding-left:38px}
.dica{
  font-size:12px;color:var(--accent);margin-top:7px;font-weight:600;
  display:flex;align-items:flex-start;gap:6px;line-height:1.4;
}
.dica b{font-family:var(--mono);font-weight:700}
.marcar{display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.marcar input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.marcar small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}

/* ---------- canais ---------- */
.canais{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.canal{position:relative;cursor:pointer}
.canal input{position:absolute;opacity:0;width:0;height:0}
.canal-face{
  display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:9px;
  border:1.5px solid var(--line-2);background:var(--surface);
  font-size:12.5px;font-weight:600;line-height:1.15;transition:border-color .13s,background .13s,color .13s;
  min-height:40px;
}
.canal:hover .canal-face{border-color:var(--ink-3)}
.ponto{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.canal input:checked + .canal-face{
  background:var(--marca);color:var(--marca-txt);border-color:var(--marca);
  box-shadow:0 2px 10px -3px var(--marca);
}
.canal input:checked + .canal-face .ponto{background:var(--marca-txt) !important;opacity:.55}
.canal input:focus-visible + .canal-face{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- cupom ---------- */
.cupom-area{margin-top:16px}
.cupom{
  position:relative;background:var(--cupom);border:1px solid var(--line);
  border-bottom:none;border-radius:12px 12px 0 0;padding:16px 17px 14px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
}
.cupom::after{
  content:"";position:absolute;top:100%;left:-1px;right:-1px;height:9px;background:var(--cupom);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/13px 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/13px 100%;
}
.cupom-topo{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-bottom:9px;margin-bottom:10px;border-bottom:1.5px dashed var(--line-2);
}
.cupom-topo span{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.linha{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;padding:3.5px 0;color:var(--ink-2)}
.linha b{color:var(--ink);font-weight:600}
.linha .val{white-space:nowrap;font-weight:600}
.linha-neg .val{color:var(--neg)}
.linha-nota{font-size:11px;color:var(--ink-3);font-family:var(--sans);padding-top:0;margin-top:-2px}
.regua{height:1.5px;background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 10px);margin:9px 0}
.linha-total{font-size:15px;padding-top:6px}
.linha-total b{font-weight:700}
.linha-total .val{font-size:21px;font-weight:700;letter-spacing:-.02em}
.val-pos{color:var(--pos)} .val-neg{color:var(--neg)}
.chips-cupom{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1.5px dashed var(--line-2)}
.chip{
  font-family:var(--sans);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.cupom-vazio{text-align:center;color:var(--ink-3);font-family:var(--sans);font-size:13px;padding:14px 8px;line-height:1.5}
.sugestao{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;
  border-top:1.5px dashed var(--line-2);font-family:var(--sans);font-size:12.5px;color:var(--ink-2);
}
.sugestao input{
  width:56px;padding:4px 7px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);
  font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;
}
.sugestao .alvo{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px}

/* ---------- detalhes ---------- */
details.mais{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.mais summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
details.mais summary::-webkit-details-marker{display:none}
details.mais summary::before{content:"+";font-family:var(--mono);font-weight:700;color:var(--accent)}
details.mais[open] summary::before{content:"–"}
details.mais > div{margin-top:12px}

/* ---------- painel de venda / edicao ---------- */
.venda-alvo{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:15px;
}
.venda-alvo .nome{font-weight:660;font-size:15px;line-height:1.25}
.venda-alvo .meta{font-size:11.5px;color:var(--ink-3);margin-top:2px}

<script id="dados" type="application/json">{"v":4,"pessoas":[]}</script>

<script id="app">
(function () {
  'use strict';

  var DADOS = JSON.parse(document.getElementById('dados').textContent);
  if (!DADOS.itens) DADOS.itens = [];
  // migra dados da versao 1, quando cada registro ja nascia vendido
  if (DADOS.vendas && DADOS.vendas.length) {
    for (var m = 0; m < DADOS.vendas.length; m++) DADOS.itens.push(DADOS.vendas[m]);
    delete DADOS.vendas;
  }
  // migra da versao 3 (uma pessoa so) para a 4 (abas). O Gabriel nasce com uma COPIA
  // das taxas, nao com a mesma referencia: comissao varia por reputacao e categoria,
  // entao um mexer na taxa nao pode mudar o lucro do outro sem ninguem perceber.
  if (!DADOS.pessoas) {
    DADOS.pessoas = [
      { id: 'victor', nome: 'Victor', canais: DADOS.canais || [], itens: DADOS.itens || [] },
      { id: 'gabriel', nome: 'Gabriel', canais: JSON.parse(JSON.stringify(DADOS.canais || [])), itens: [] }
    ];
  }
  delete DADOS.canais; delete DADOS.itens;
  DADOS.v = 4;

  // =====================================================================
  //  LIGAÇÃO COM O BANCO
  //  Estes dois valores são públicos por natureza: todo app Supabase os
  //  carrega no navegador. Quem protege os dados são as regras de acesso
  //  criadas no SQL, que rodam no servidor. A chave service_role NUNCA
  //  entra aqui.
  // =====================================================================
  var SUPA = {
    url: 'https://nriqozvycjnbqncqdtei.supabase.co',
    chave: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yaXFvenZ5Y2puYnFuY3FkdGVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMzEwNDEsImV4cCI6MjEwMjkwNzA0MX0.a7gSItW6ceJEMlJn1JyjOyibIWli4IfCW5yKaoYG4dg'
  };

  var SESSAO = null;             // { access_token, refresh_token, expira_em, usuario }
  var CHAVE_SESSAO = 'quanto-sobrou-sessao';

  function configurado() {
    return SUPA.url.indexOf('http') === 0 && SUPA.chave.length > 20;
  }
  function guardarSessao(s) {
    SESSAO = s;
    try {
      if (s) localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s));
      else localStorage.removeItem(CHAVE_SESSAO);
    } catch (e) {}
  }
  function api(caminho, opcoes) {
    opcoes = opcoes || {};
    var cab = { apikey: SUPA.chave, 'Content-Type': 'application/json' };
    if (SESSAO && SESSAO.access_token) cab.Authorization = 'Bearer ' + SESSAO.access_token;
    if (opcoes.extras) for (var k in opcoes.extras) if (Object.prototype.hasOwnProperty.call(opcoes.extras, k)) cab[k] = opcoes.extras[k];
    return fetch(SUPA.url + caminho, {
      method: opcoes.metodo || 'GET',
      headers: cab,
      body: opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined
    });
  }
  function autenticar(corpo, tipo) {
    return fetch(SUPA.url + '/auth/v1/token?grant_type=' + tipo, {
      method: 'POST',
      headers: { apikey: SUPA.chave, 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw { status: r.status, msg: (j && (j.error_description || j.msg || j.message)) || '' };
        return j;
      });
    }).then(function (j) {
      guardarSessao({
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        expira_em: Date.now() + ((j.expires_in || 3600) * 1000),
        usuario: j.user ? { id: j.user.id, email: j.user.email } : (SESSAO ? SESSAO.usuario : null)
      });
      return SESSAO;
    });
  }
  // renova o acesso antes de vencer, para o app nao cair no meio do uso
  function comSessao() {
    if (!SESSAO) return Promise.reject({ tipo: 'sem-sessao' });
    if (SESSAO.expira_em - Date.now() > 60000) return Promise.resolve(SESSAO);
    return autenticar({ refresh_token: SESSAO.refresh_token }, 'refresh_token')
      .catch(function () { throw { tipo: 'sem-sessao' }; });
  }
  // =====================================================================
  //  CAMADA DE DADOS
  //  Cada unidade e cada cadastro de produto e uma linha propria. Gravar
  //  passou a mexer numa linha so, entao dois aparelhos abertos ao mesmo
  //  tempo nao se sobrescrevem mais.
  // =====================================================================

  function daLinha(u, nomePorId) {
    return {
      id: u.id,
      produtoId: u.produto_id,
      produto: nomePorId[u.produto_id] || '(sem cadastro)',
      custo: num(u.custo),
      fornecedor: u.fornecedor || '',
      dCompra: u.d_compra || '',
      dChegada: u.d_chegada || '',
      dVenda: u.d_venda || '',
      dRecebido: u.d_recebido || '',
      canal: u.canal || '',
      preco: num(u.preco),
      frete: u.frete === null || u.frete === undefined ? null : num(u.frete),
      grupo: u.grupo || '',
      alvo: num(u.alvo),
      alvoCanal: u.alvo_canal || ''
    };
  }

  function paraLinha(it, pessoaId) {
    return {
      pessoa: pessoaId,
      produto_id: it.produtoId,
      custo: num(it.custo),
      fornecedor: it.fornecedor || '',
      d_compra: it.dCompra || null,
      d_chegada: it.dChegada || null,
      d_venda: it.dVenda || null,
      d_recebido: it.dRecebido || null,
      canal: it.canal || '',
      preco: num(it.preco),
      frete: it.frete === null || it.frete === undefined ? null : num(it.frete),
      grupo: it.grupo || '',
      alvo: num(it.alvo),
      alvo_canal: it.alvoCanal || ''
    };
  }

  function carregarDoBanco() {
    var pessoas = null, produtos = null;
    return comSessao().then(function () {
      return Promise.all([
        api('/rest/v1/pessoas?select=id,nome,dono,canais&order=id.asc'),
        api('/rest/v1/produtos?select=id,pessoa,nome,fornecedor&order=nome.asc'),
        api('/rest/v1/unidades?select=*&order=criado_em.asc')
      ]);
    }).then(function (rs) {
      for (var k = 0; k < rs.length; k++) {
        if (rs[k].status === 401) throw { tipo: 'sem-sessao' };
        // 404 na tabela nova = o SQL da migracao ainda nao foi rodado
        if (rs[k].status === 404) throw { tipo: 'sem-migracao' };
        if (!rs[k].ok) throw { tipo: 'rede', status: rs[k].status };
      }
      return Promise.all([rs[0].json(), rs[1].json(), rs[2].json()]);
    }).then(function (partes) {
      pessoas = partes[0]; produtos = partes[1];
      var unidades = partes[2];
      if (!pessoas || !pessoas.length) throw { tipo: 'vazio' };

      var nomePorId = {};
      for (var i = 0; i < produtos.length; i++) nomePorId[produtos[i].id] = produtos[i].nome;

      DADOS = { v: 5, pessoas: pessoas.map(function (p) {
        return {
          id: p.id, nome: p.nome, dono: p.dono,
          canais: Array.isArray(p.canais) ? p.canais : [],
          produtos: produtos.filter(function (x) { return x.pessoa === p.id; }),
          itens: unidades.filter(function (u) { return u.pessoa === p.id; })
                         .map(function (u) { return daLinha(u, nomePorId); })
        };
      }) };
      DADOS.pessoas.forEach(aplicarGestao);
      return corrigirLegoPorsche().then(function () { return DADOS; });
    });
  }

  // ---------- operacoes de linha ----------
  function conferir(r) {
    if (r.status === 401) throw { tipo: 'sem-sessao' };
    if (r.status === 403) throw { tipo: 'permissao' };
    if (r.status === 404) throw { tipo: 'sem-migracao' };
    if (!r.ok) throw { tipo: 'rede', status: r.status };
    return r;
  }

  // acha o cadastro pelo nome ou cria um novo; devolve o id
  function garantirProduto(nome, fornecedor) {
    var limpo = String(nome || '').trim();
    var achado = null;
    for (var i = 0; i < PESSOA.produtos.length; i++) {
      if (PESSOA.produtos[i].nome.trim().toLowerCase() === limpo.toLowerCase()) achado = PESSOA.produtos[i];
    }
    if (achado) return Promise.resolve(achado.id);
    return api('/rest/v1/produtos', {
      metodo: 'POST',
      corpo: { pessoa: PESSOA.id, nome: limpo, fornecedor: fornecedor || '' },
      extras: { Prefer: 'return=representation' }
    }).then(conferir).then(function (r) { return r.json(); }).then(function (linhas) {
      var novo = linhas[0];
      PESSOA.produtos.push(novo);
      return novo.id;
    });
  }

  function criarUnidades(lista) {
    return api('/rest/v1/unidades', {
      metodo: 'POST',
      corpo: lista.map(function (it) { return paraLinha(it, PESSOA.id); }),
      extras: { Prefer: 'return=representation' }
    }).then(conferir).then(function (r) { return r.json(); }).then(function (linhas) {
      // devolve os ids que o banco gerou, para as acoes seguintes acertarem a linha
      for (var i = 0; i < linhas.length && i < lista.length; i++) lista[i].id = linhas[i].id;
      return lista;
    });
  }

  function alterarUnidade(id, campos) {
    return api('/rest/v1/unidades?id=eq.' + encodeURIComponent(id), {
      metodo: 'PATCH', corpo: campos, extras: { Prefer: 'return=minimal' }
    }).then(conferir);
  }

  function apagarUnidade(id) {
    return api('/rest/v1/unidades?id=eq.' + encodeURIComponent(id), {
      metodo: 'DELETE', extras: { Prefer: 'return=minimal' }
    }).then(conferir);
  }

  function lerCanaisAtuais(pessoa) {
    return api('/rest/v1/pessoas?id=eq.' + encodeURIComponent(pessoa.id) + '&select=canais')
      .then(conferir).then(function (r) { return r.json(); }).then(function (linhas) {
        if (!linhas.length || !Array.isArray(linhas[0].canais)) throw { tipo: 'permissao' };
        return linhas[0].canais;

  // ---------- projecao ----------
  // agrupa o que AINDA NAO foi vendido por nome de produto: 7 unidades iguais viram
  // uma linha so, com um preco previsto que vale para todas
  var GRUPOS = [];

  function gruposProjecao() {
    var mapa = {}, ordem = [];
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i];
      if (fase(it) === 'vendido' || fase(it) === 'devolucao') continue;
      var k = String(it.produto || '(sem nome)').trim().toLowerCase();
      if (!mapa[k]) { mapa[k] = { nome: it.produto || '(sem nome)', itens: [], custo: 0 }; ordem.push(k); }
      mapa[k].itens.push(it);
      mapa[k].custo += num(it.custo);
    }
    var r = [];
    for (var j = 0; j < ordem.length; j++) r.push(mapa[ordem[j]]);
    return r;
  }
  function canalPadrao() {
    // o canal que ele mais usou de verdade; sem historico, o primeiro da lista
    var cont = {}, melhor = '', max = 0;
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i];
      if (!it.dVenda || !it.canal) continue;
      cont[it.canal] = (cont[it.canal] || 0) + 1;
      if (cont[it.canal] > max) { max = cont[it.canal]; melhor = it.canal; }
    }
    return melhor || (DADOS.canais[0] ? DADOS.canais[0].id : '');
  }
  function alvoDoGrupo(g) {
    for (var i = 0; i < g.itens.length; i++) if (num(g.itens[i].alvo) > 0) return num(g.itens[i].alvo);
    return 0;
  }
  function canalDoGrupo(g) {
    for (var i = 0; i < g.itens.length; i++) if (g.itens[i].alvoCanal) return g.itens[i].alvoCanal;
    return canalPadrao();
  }

  function desenharProjecao() {
    GRUPOS = gruposProjecao();
    $('#sec-projecao').hidden = GRUPOS.length === 0;
    if (!GRUPOS.length) { $('#proj-lista').innerHTML = ''; $('#proj-totais').innerHTML = ''; return; }
    var unidades = 0;
    for (var u = 0; u < GRUPOS.length; u++) unidades += GRUPOS[u].itens.length;
    $('#conta-proj').textContent = plural(unidades, 'produto', 'produtos');

    var h = '';
    for (var i = 0; i < GRUPOS.length; i++) {
      var g = GRUPOS[i], fases = {};
      for (var j = 0; j < g.itens.length; j++) fases[fase(g.itens[j])] = 1;
      var onde = fases.caminho && fases.estoque ? 'parte a caminho, parte em estoque'
        : (fases.caminho ? 'a caminho' : 'em estoque');
      var sel = canalDoGrupo(g), opts = '';
      for (var k = 0; k < DADOS.canais.length; k++) {
        var c = DADOS.canais[k];
        opts += '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.curto) + '</option>';
      }
      var alvo = alvoDoGrupo(g);
      h += '<div class="proj-item">'
        + '<div class="proj-id"><div class="item-nome">' + esc(g.nome) + '</div>'
        + '<div class="item-meta"><span>' + plural(g.itens.length, 'unidade', 'unidades') + ' · custo ' + brl(g.custo) + ' · ' + onde + '</span></div></div>'
        + '<select class="proj-canal" data-g="' + i + '" aria-label="Canal previsto para ' + esc(g.nome) + '">' + opts + '</select>'
        + '<div class="com-prefixo"><span class="prefixo">R$</span>'
        + '<input class="entrada entrada-dinheiro proj-preco" data-g="' + i + '" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"'
        + ' aria-label="Preço previsto por unidade de ' + esc(g.nome) + '" value="' + (alvo > 0 ? paraCampo(alvo) : '') + '"></div>'
        + '<div class="proj-res" id="proj-res-' + i + '"></div></div>';
    }
    $('#proj-lista').innerHTML = h;
    var campos = $('#proj-lista').querySelectorAll('.proj-preco, .proj-canal');
    for (var m = 0; m < campos.length; m++) {
      campos[m].addEventListener('input', recalcProjecao);
      campos[m].addEventListener('change', recalcProjecao);
    }
    recalcProjecao();
  }

  function recalcProjecao() {
    var fat = 0, taxas = 0, custo = 0, lucro = 0, semPreco = 0;
    for (var i = 0; i < GRUPOS.length; i++) {
      var g = GRUPOS[i];
      var inp = document.querySelector('.proj-preco[data-g="' + i + '"]');
      var sel = document.querySelector('.proj-canal[data-g="' + i + '"]');
      var res = document.getElementById('proj-res-' + i);
      var preco = inp ? num(inp.value) : 0;
      var canal = sel ? canalDe(sel.value) : null;
      if (preco <= 0 || !canal) {
        semPreco++;
        if (res) res.innerHTML = '<span class="proj-vazio">defina o preço</span>';
        continue;
      }
      var gFat = 0, gTaxa = 0, gLucro = 0;
      for (var j = 0; j < g.itens.length; j++) {
        var c = conta(num(g.itens[j].custo), preco, comCustos(canal, custosDoProduto(g.itens[j].produtoId, canal)), null);
        gFat += c.preco; gTaxa += c.taxa + c.frete; gLucro += c.lucro;
      }
      fat += gFat; taxas += gTaxa; custo += g.custo; lucro += gLucro;
      if (res) {
        res.innerHTML = '<div class="proj-lucro" style="color:' + (gLucro < 0 ? 'var(--neg)' : 'var(--pos)') + '">' + brl(gLucro) + '</div>'
          + '<div class="proj-sub">' + brl(gLucro / g.itens.length) + ' por unidade · margem ' + pc(gFat > 0 ? gLucro / gFat : NaN) + '</div>';
      }
    }

    var realizado = 0, vend = porFase('vendido');
    for (var v = 0; v < vend.length; v++) realizado += contaDoItem(vend[v]).lucro;

    // arredonda para centavos ANTES de exibir e somar: senao as parcelas na tela
    // nao fecham com o total, e a conta toda parece errada mesmo estando certa
    var c2 = function (x) { return Math.round(x * 100) / 100; };
    fat = c2(fat); taxas = c2(taxas); custo = c2(custo); realizado = c2(realizado);
    lucro = c2(fat - taxas - custo);

    var t = '';
    if (fat > 0) {
      t += '<div class="proj-caixa">'
        + '<div class="proj-linha"><span>Faturamento projetado</span><span class="v">' + brl(fat) + '</span></div>'
        + '<div class="proj-linha neg"><span>(−) Taxas e frete</span><span class="v">− ' + brl(taxas) + '</span></div>'
        + '<div class="proj-linha neg"><span>(−) Custo dos produtos</span><span class="v">− ' + brl(custo) + '</span></div>'
        + '<div class="regua"></div>'
        + '<div class="proj-linha destaque"><b>Lucro projetado</b><span class="v" style="color:' + (lucro < 0 ? 'var(--neg)' : 'var(--pos)') + '">' + brl(lucro) + '</span></div>'
        + '<div class="proj-linha"><span>margem projetada</span><span class="v">' + pc(fat > 0 ? lucro / fat : NaN) + '</span></div>'
        + '</div>';
    }
    if (semPreco > 0) {
      t += '<div class="proj-alerta">' + (semPreco === 1
        ? '1 produto ainda está sem preço previsto e não entrou na conta.'
        : semPreco + ' produtos ainda estão sem preço previsto e não entraram na conta.') + '</div>';
    }
    if (fat > 0) {
      t += '<div class="proj-somatorio">Vendendo tudo pelo preço previsto, o lucro do negócio sairia de <b>' + brl(realizado)
        + '</b> (o que você já realizou) para <b>' + brl(realizado + lucro) + '</b>.</div>';
    }
    $('#proj-totais').innerHTML = t;
  }

  // preenche so os campos vazios, mirando a margem que ele digitou
  function sugerirPrecos() {
    var alvoM = num($('#proj-margem').value) || 30;
    if (alvoM < 1 || alvoM > 90) { erro('<b>Margem inválida.</b> Use um número entre 1 e 90.'); return; }
    $('#aviso-erro').hidden = true;
    for (var i = 0; i < GRUPOS.length; i++) {
      var inp = document.querySelector('.proj-preco[data-g="' + i + '"]');
      var sel = document.querySelector('.proj-canal[data-g="' + i + '"]');
      if (!inp || num(inp.value) > 0) continue;
      var canal = sel ? canalDe(sel.value) : null;
      // usa o custo medio do grupo como base do preco sugerido
      var medio = GRUPOS[i].custo / GRUPOS[i].itens.length;
      var sugerido = precoAlvo(medio, comCustos(canal, custosDoProduto(GRUPOS[i].itens[0].produtoId, canal)), alvoM / 100);
      if (isFinite(sugerido)) inp.value = paraCampo(sugerido);
    }
    recalcProjecao();
  }

  function tentarEntrar() {
    if (!configurado()) {
      $('#login-erro').textContent = 'O app ainda não foi ligado ao banco.';
      return;
    }
    var email = $('#login-email').value.trim();
    var senha = $('#login-senha').value;
    if (!email || !senha) { $('#login-erro').textContent = 'Preencha e-mail e senha.'; return; }
    var btn = $('#btn-entrar');
    btn.disabled = true; btn.innerHTML = '<span class="salvando"></span> Entrando…';
    $('#login-erro').textContent = '';
    autenticar({ email: email, password: senha }, 'password')
      .then(function () { return carregarDoBanco(); })
      .then(function () {
        btn.disabled = false; btn.textContent = 'Entrar';
        $('#login-senha').value = '';
        abrirApp();
      })
      .catch(function (e) {
        btn.disabled = false; btn.textContent = 'Entrar';
        $('#login-senha').value = '';
        // senha errada apaga a sessao; falha de rede depois de entrar, nao —
        // senao o usuario redigita a senha por causa de um tropeco do banco.
        if (!e || e.tipo !== 'rede') guardarSessao(null);
        $('#login-erro').textContent = recadoDeFalha(e);
      });
  }

  // Uma mensagem so, usada tanto no login manual quanto no arranque automatico.
  function recadoDeFalha(e) {
    var t = e && e.tipo;
    if (e && e.status === 400) return 'E-mail ou senha errados.';
    if (t === 'vazio') return 'Entrou, mas o banco está sem as abas. Rode o 01-estrutura.sql.';
    if (t === 'sem-migracao') return 'O banco ainda não tem as tabelas novas. Rode o 04-produtos-e-unidades.sql no Supabase.';
    if (t === 'sem-sessao') return 'Sua sessão expirou. Entre de novo.';
    if (t === 'rede') return 'O banco respondeu com erro ' + e.status + '. Seu login continua salvo — tente de novo em instantes.';
    return 'Não consegui falar com o banco. Verifique a conexão e tente de novo — seu login continua salvo.';
  }

  // ============================ TEMPOS MEDIOS ============================
  function mediaDias(pares) {
    var soma = 0, n = 0;
    for (var i = 0; i < pares.length; i++) {
      var d = dias(pares[i][0], pares[i][1]);
      if (d != null && d >= 0) { soma += d; n++; }
    }
    return n ? Math.round(soma / n) : null;
  }

  function desenharTempos() {
    var chegaram = [], venderam = [], caiu = [];
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i];
      if (it.dCompra && it.dChegada) chegaram.push([it.dCompra, it.dChegada]);
      if (it.dCompra && it.dVenda) venderam.push([it.dCompra, it.dVenda]);
      if (it.dVenda && it.dRecebido) caiu.push([it.dVenda, it.dRecebido]);
    }
    var mc = mediaDias(chegaram), mv = mediaDias(venderam);
    var parado = 0, nParado = 0;
    for (var j = 0; j < DADOS.itens.length; j++) {
      var x = DADOS.itens[j];
      if (!x.dVenda) { parado += num(x.custo); nParado++; }
    }
    var t = [
      { r: 'Da compra até chegar', n: mc == null ? '—' : mc + (mc === 1 ? ' dia' : ' dias'),
        s: chegaram.length ? 'média de ' + plural(chegaram.length, 'produto', 'produtos') : 'nenhum chegou ainda' },
      { r: 'Da compra à venda efetiva', n: mv == null ? '—' : mv + (mv === 1 ? ' dia' : ' dias'),
        s: venderam.length ? 'inclui o tempo das devoluções' : 'nenhuma venda efetiva ainda' },
      { r: 'Parado agora', n: brl(parado), s: plural(nParado, 'produto sem vender', 'produtos sem vender'),
        cor: parado > 0 ? 'var(--warn)' : '' }
    ];
    $('#tiles-tempo').innerHTML = htmlTiles(t);
  }

      if (!it.dVenda) continue;
      if (recebido ? !!it.dRecebido : !it.dRecebido) r.push(it);

  function desenharCaixa() {
    var esperando = vendasPorDinheiro(false), caiu = vendasPorDinheiro(true);
    var aReceber = 0, noCaixa = 0, saiu = 0, i, c;
    for (i = 0; i < esperando.length; i++) aReceber += contaDoItem(esperando[i]).liquido;
    for (i = 0; i < caiu.length; i++) noCaixa += contaDoItem(caiu[i]).liquido;
    for (i = 0; i < DADOS.itens.length; i++) saiu += num(DADOS.itens[i].custo);

    var pares = [];
    for (i = 0; i < caiu.length; i++) pares.push([caiu[i].dVenda, caiu[i].dRecebido]);
    var mr = mediaDias(pares);

    $('#tiles-caixa').innerHTML = htmlTiles([
      { r: 'Tem para entrar', n: brl(aReceber), s: plural(esperando.length, 'venda esperando', 'vendas esperando'),

      { r: 'Saiu em compras', n: brl(saiu), s: 'custo de tudo que entrou' },
      { r: 'Demora até cair', n: mr == null ? '—' : mr + (mr === 1 ? ' dia' : ' dias'),

    ]);

    $('#conta-recebido').textContent = caiu.length ? brl(noCaixa) : '';

    function combina(it) { var canal = canalDe(it.canal); return !busca || normalizarBusca(it.produto + ' ' + (canal ? canal.nome : '')).indexOf(busca) >= 0; }
    $('#lista-receber').innerHTML = htmlDinheiro(esperando.filter(combina), false);
    $('#lista-recebido').innerHTML = htmlDinheiro(caiu.filter(combina), true);

  function htmlDinheiro(lista, jaCaiu) {
    if (!lista.length) {
      return '<div class="vazio" style="padding:26px 12px"><strong>'
        + (jaCaiu ? 'Nada recebido ainda' : 'Nada esperando')
        + '</strong><p>' + (jaCaiu
          ? 'Quando você der baixa numa venda, ela aparece aqui.'
          : 'Toda venda registrada entra aqui até você confirmar que o dinheiro caiu.') + '</p></div>';
    }
    lista.sort(function (a, b) {
      return jaCaiu ? (b.dRecebido || '').localeCompare(a.dRecebido || '')
                    : (a.dVenda || '').localeCompare(b.dVenda || '');
    });
    var h = '', hoje_ = hoje();
    for (var i = 0; i < lista.length; i++) {
      var it = lista[i], cn = canalDe(it.canal), c = contaDoItem(it);
      var meta = [];
      if (cn) meta.push(esc(cn.curto));
      meta.push('vendido ' + dataBR(it.dVenda));
      if (jaCaiu) {
        meta.push('<span class="selo-caiu">caiu ' + dataBR(it.dRecebido) + '</span>');
      } else {
        var esperandoHa = dias(it.dVenda, hoje_);
        meta.push('<span class="selo-espera">esperando ' + (esperandoHa == null ? '?' : plural(esperandoHa, 'dia', 'dias')) + '</span>');
      }
      h += '<div class="dinheiro-linha">'
        + '<div><div class="dinheiro-nome">' + esc(it.produto) + '</div>'
        + '<div class="dinheiro-meta">' + meta.join(' · ') + '</div></div>'
        + '<div class="dinheiro-val" style="color:' + (jaCaiu ? 'var(--pos)' : 'var(--ink)') + '">' + brl(c.liquido) + '</div>'
        + '<div class="item-acoes">'
        + (podeEditar()

  // Todas as vendas entram na serie. Historicos longos sao agrupados em
  // intervalos consecutivos, sem truncar dias nem descartar valores.
  function serieGrafico(vendas, maxPontos, intervalo, metrica) {
    if (!vendas.length) return [];
    var datas = vendas.map(function (it) { return it.dVenda; }).sort();
    var inicio = intervalo.inicio || datas[0], fim = intervalo.fim || datas[datas.length - 1];
    var base = Date.parse(inicio + 'T00:00:00Z'), final = Date.parse(fim + 'T00:00:00Z');
    var nDias = Math.max(1, Math.round((final - base) / 86400000) + 1), passo = Math.max(1, Math.ceil(nDias / maxPontos));
    var lista = [];
    for (var i = 0; i < nDias; i += passo) {
      lista.push({ inicio: new Date(base + i * 86400000).toISOString().slice(0, 10), fim: new Date(base + Math.min(nDias - 1, i + passo - 1) * 86400000).toISOString().slice(0, 10), valor: 0, qtd: 0 });
    }
    vendas.forEach(function (it) {
      var idx = Math.floor((Date.parse(it.dVenda + 'T00:00:00Z') - base) / 86400000 / passo);
      if (!lista[idx]) return;
      lista[idx].valor += metrica === 'lucro' ? contaDoItem(it).lucro : num(it.preco); lista[idx].qtd++;
    });
    return lista;
  }


  // ============================ GRAFICO ============================
  function desenharGraficoDiario() {
    var alvo = $('#graf-diario'); if (!alvo) return;
    var vend = vendasAnalisadas(), largura = Math.max(280, Math.round(alvo.clientWidth || 720));
    $('#graf-faturamento').setAttribute('aria-pressed', GRAF_METRICA === 'faturamento' ? 'true' : 'false');
    $('#graf-lucro').setAttribute('aria-pressed', GRAF_METRICA === 'lucro' ? 'true' : 'false');
    if (!vend.length) {
      alvo.innerHTML = '<div class="graf-vazio">Sem vendas no período selecionado.<br>Amplie o período ou registre uma nova venda.</div>';
      $('#graf-periodo').textContent = ''; $('#graf-tooltip').textContent = ''; return;
    }
    var lista = serieGrafico(vend, largura < 500 ? 12 : 24, limitesAnalise(), GRAF_METRICA);
    var max = Math.max.apply(Math, lista.map(function (r) { return r.valor; }).concat([0]));
    var min = Math.min.apply(Math, lista.map(function (r) { return r.valor; }).concat([0]));
    if (max === min) max = min + 1;
    var L = 62, R = 12, T = 22, B = 34, altura = largura < 500 ? 230 : 290;
    var areaL = largura - L - R, areaA = altura - T - B, passo = areaL / lista.length;
    function y(valor) { return T + (max - valor) / (max - min) * areaA; }
    var zero = y(0), barra = Math.max(3, Math.min(30, passo * .65));
    var svg = '<svg viewBox="0 0 ' + largura + ' ' + altura + '" role="img" aria-label="' + (GRAF_METRICA === 'lucro' ? 'Lucro' : 'Faturamento') + ' no período">';
    for (var i = 0; i <= 4; i++) {
      var valor = min + (max - min) * i / 4, y1 = y(valor);
      var rotulo = Math.abs(valor) >= 1000 ? (valor / 1000).toFixed(1).replace('.', ',') + ' mil' : Math.round(valor).toLocaleString('pt-BR');
      svg += '<line class="grade-linha" x1="' + L + '" y1="' + y1.toFixed(1) + '" x2="' + (largura - R) + '" y2="' + y1.toFixed(1) + '"/><text class="rotulo" x="' + (L - 9) + '" y="' + (y1 + 4).toFixed(1) + '" text-anchor="end">' + rotulo + '</text>';
    }
    lista.forEach(function (r, idx) {
      var x = L + passo * idx + (passo - barra) / 2, yr = y(r.valor), h = Math.abs(yr - zero);
      var periodo = dataBR(r.inicio) + (r.inicio !== r.fim ? ' a ' + dataBR(r.fim) : '');
      var info = periodo + ': ' + brl(r.valor) + ' · ' + plural(r.qtd, 'venda', 'vendas');
      if (r.qtd) svg += '<rect class="barra-dia" x="' + x.toFixed(1) + '" y="' + (r.valor >= 0 ? yr : zero).toFixed(1) + '" width="' + barra.toFixed(1) + '" height="' + Math.max(2, h).toFixed(1) + '" rx="4" style="fill:' + (r.valor < 0 ? 'var(--neg)' : 'var(--accent)') + '" tabindex="0" data-graf-info="' + esc(info) + '" role="img" aria-label="' + esc(info) + '"><title>' + esc(info) + '</title></rect>';
      if (idx === 0 || idx === lista.length - 1 || idx % Math.max(1, Math.ceil(lista.length / (largura < 500 ? 4 : 7))) === 0) svg += '<text class="rotulo" x="' + (x + barra / 2).toFixed(1) + '" y="' + (altura - 10) + '" text-anchor="middle">' + r.inicio.slice(8) + '/' + r.inicio.slice(5, 7) + '</text>';
    });
    svg += '<line class="eixo" x1="' + L + '" y1="' + zero.toFixed(1) + '" x2="' + (largura - R) + '" y2="' + zero.toFixed(1) + '"/></svg>';
    alvo.innerHTML = svg;
    $('#graf-periodo').textContent = dataBR(lista[0].inicio) + ' — ' + dataBR(lista[lista.length - 1].fim);
    $('#graf-tooltip').textContent = (lista[0].inicio !== lista[0].fim ? 'Vendas agrupadas por intervalos. ' : '') + (GRAF_METRICA === 'lucro' ? 'Lucro das vendas, antes das despesas do negócio.' : 'Faturamento bruto, antes das taxas.') + ' Passe o mouse ou selecione uma barra para ver o valor.';
    var barras = alvo.querySelectorAll('[data-graf-info]');
    for (var j = 0; j < barras.length; j++) {
      ['pointerenter', 'focus', 'click'].forEach(function (evento) { barras[j].addEventListener(evento, function () { $('#graf-tooltip').textContent = this.getAttribute('data-graf-info'); }); });
    }
  }

  // ---------- alterar ----------
  function salvarEdicao() {
    if (salvando) return;
    $('#aviso-erro').hidden = true;
    var it = itemDe(editando); if (!it) return;
    var nome = $('#ed-produto').value.trim();
    if (!nome) { erro('<b>Falta o nome do produto.</b>'); $('#ed-produto').focus(); return; }
    var custo = num($('#ed-custo').value);
    if (custo <= 0) { erro('<b>Falta o custo.</b> Digite quanto esta unidade custou.'); $('#ed-custo').focus(); return; }
    var dCompra = $('#ed-dcompra').value || '';
    var dChegada = $('#ed-dchegada').value || '';
    if (dCompra && dChegada && dChegada < dCompra) {
      erro('<b>A chegada não pode ser antes da compra.</b> Comprado em ' + dataBR(dCompra) + '.');
      return;
    }
    var ocorrencias = historicoUnidade(it.id);
    if (ocorrencias.length && (!dCompra || !dChegada || dCompra > ocorrencias[0].venda.dVenda || dChegada > ocorrencias[0].venda.dVenda)) {
      erro('<b>Preserve as datas originais do produto.</b> A compra e a primeira chegada devem existir e ser anteriores à primeira venda do histórico.'); return;
    }
    var vendido = fase(it) === 'vendido';
    var custosVenda = vendido ? lerCustos('ed', true) : null;
    if (vendido && !custosVenda) return;
    var pessoa = PESSOA, lembrarCustos = vendido && $('#ed-lembrar').checked;
    var custosAntes = vendido ? custosDaVenda(it) || retratoCustos(canalDe(it.canal), contaDoItem(it).frete) : null;
    var canal = it.canal, preco = it.preco, frete = it.frete, dVenda = it.dVenda;
    if (vendido) {
      var r = document.querySelector('#ed-canais input:checked');
      if (!r) { erro('<b>Falta o canal da venda.</b>'); return; }
      canal = r.value;
      preco = num($('#ed-preco').value);
      if (preco <= 0) { erro('<b>Falta o valor da venda.</b>'); $('#ed-preco').focus(); return; }
      dVenda = $('#ed-dvenda').value || '';
      if (!dVenda) { erro('<b>Falta a data da saída.</b>'); $('#ed-dvenda').focus(); return; }
      if (dChegada && dVenda < dChegada) {
        erro('<b>A saída não pode ser antes da chegada.</b> Chegou em ' + dataBR(dChegada) + '.');
        return;
      }
      frete = custosVenda.frete;
    }

    var antes = {
      produto: it.produto, produtoId: it.produtoId, custo: it.custo, fornecedor: it.fornecedor,
      dCompra: it.dCompra, dChegada: it.dChegada, canal: it.canal, preco: it.preco,
      frete: it.frete, dVenda: it.dVenda
    };
    var idAlvo = it.id;
    var fornecedor = $('#ed-fornecedor').value.trim();
    var trocouNome = nome.toLowerCase() !== String(it.produto).trim().toLowerCase();

    salvar(function () {
      // trocar o nome aponta a unidade para outro cadastro, criando se preciso
      var passo = trocouNome ? garantirProduto(nome, fornecedor) : Promise.resolve(it.produtoId);
      return passo.then(function (produtoId) {
        var custosGravados = false;
        var gravar = vendido ? gravarCustos(pessoa, canal, produtoId, custosVenda, idAlvo, lembrarCustos) : Promise.resolve();
        return gravar.then(function () { custosGravados = vendido; return alterarUnidade(idAlvo, {
          produto_id: produtoId, custo: custo, fornecedor: fornecedor,
          d_compra: dCompra || null, d_chegada: dChegada || null,
          canal: canal, preco: preco, frete: frete, d_venda: dVenda || null
        }); }).catch(function (e) {
          if (!custosGravados || canal !== antes.canal) throw e;
          return gravarCustos(pessoa, antes.canal, antes.produtoId, custosAntes, idAlvo, false)
            .then(function () { throw e; });
        }).then(function () {
          it.produtoId = produtoId; it.produto = nome;
          it.custo = custo; it.fornecedor = fornecedor;
          it.dCompra = dCompra; it.dChegada = dChegada;
          it.canal = canal; it.preco = preco; it.frete = frete; it.dVenda = dVenda;
        });
      });
    }, $('#btn-editar-salvar'), 'Salvar alterações', null, function () {
      fecharPaineis(); desenharTudo();
    });
  }

  // historico de cada produto, somando tudo que ja passou por ele
  function resumoPorProduto() {
    var mapa = {};
    var cat = (PESSOA && PESSOA.produtos) ? PESSOA.produtos : [];
    for (var i = 0; i < cat.length; i++) {
      mapa[cat[i].id] = {
        id: cat[i].id, nome: cat[i].nome, fornecedor: cat[i].fornecedor || '',
        comprados: 0, caminho: 0, estoque: 0, retorno: 0, vendidos: 0,
        custoTotal: 0, faturamento: 0, lucro: 0, despesas: 0, taxas: 0, giros: []
      };
    }
    var itens = (PESSOA && PESSOA.itens) ? PESSOA.itens : [];
    for (var j = 0; j < itens.length; j++) {
      var it = itens[j], r = mapa[it.produtoId];
      if (!r) continue;
      r.comprados++;
      r.custoTotal += num(it.custo);
      var f = fase(it);
      if (f === 'caminho') r.caminho++;
      else if (f === 'estoque') r.estoque++;
      else if (f === 'devolucao') r.retorno++;
      else {
        r.vendidos++;
        var c = contaDoItem(it);
        r.faturamento += c.preco; r.lucro += c.lucro; r.taxas += c.taxa + c.frete;
        var g = diasCiclo(it);
        if (g != null && g >= 0) r.giros.push(g);
      }
    }
    var lista = [];
    despesasDaPessoa().forEach(function (d) { if (mapa[d.produtoId]) mapa[d.produtoId].despesas += num(d.valor); });
    for (var k in mapa) if (Object.prototype.hasOwnProperty.call(mapa, k)) { mapa[k].lucro -= mapa[k].despesas; lista.push(mapa[k]); }
    lista.sort(function (a, b) {
      if (b.vendidos !== a.vendidos) return b.vendidos - a.vendidos;
      return b.comprados - a.comprados;
    });
    return lista;
  }

    tComprados = 0; tVendidos = 0; tLucro = 0; tFat = 0;
    lista.forEach(function (r) { tComprados += r.comprados; tVendidos += r.vendidos; tLucro += r.lucro; tFat += r.faturamento; });

    var h = '<div class="tabela-caixa"><table><thead><tr>'
      + '<th>Produto</th><th>Comprou</th><th>Parado</th><th>Vendeu</th>'
      + '<th>Faturou</th><th>Resultado</th><th>Margem</th><th>Ciclo total</th><th>Custos por canal</th>'
      + '</tr></thead><tbody>';
    for (var j = 0; j < lista.length; j++) {

      var giro = r.giros.length ? Math.round(r.giros.reduce(function (s, x) { return s + x; }, 0) / r.giros.length) : null;
      var meta = [];
      if (r.fornecedor) meta.push(esc(r.fornecedor));

      if (r.retorno) meta.push(r.retorno + ' em retorno');
      if (r.despesas) meta.push('despesas vinculadas ' + brl(r.despesas));
      var configurados = DADOS.canais.filter(function (c) { return !!custosDoProduto(r.id, c); });
      h += '<tr>'
        + '<td data-l="Produto"><span class="prod">' + esc(r.nome) + '<small>' + meta.join(' · ') + '</small></span></td>'

        + '<td data-l="Parado" class="num-cel"' + (parado ? ' style="color:var(--warn)"' : '') + '>' + parado + '</td>'

        + '<td data-l="Custos por canal"><span class="meta">' + (configurados.length ? configurados.map(function (c) { return esc(c.curto); }).join(' · ') : 'Ainda não cadastrado') + '</span>'
        + (podeEditar() ? '<br><button class="btn btn-mini" type="button" data-custos-produto="' + esc(r.id) + '">Taxas e frete</button>' : '') + '</td>'
        + '</tr>';
    }
    h += '</tbody><tfoot><tr><td>' + plural(lista.length, 'produto', 'produtos') + '</td>'
      + '<td data-l="Comprou" class="num-cel">' + tComprados + '</td>'
      + '<td data-l="Parado" class="num-cel">' + (tComprados - tVendidos) + '</td>'

  // ---------- persistencia: a pagina republica a si mesma ----------

  function erro(msg) { $('#aviso-erro-txt').innerHTML = msg; $('#aviso-erro').hidden = false; }


  // no artifact o download tem que passar pela capability (o sandbox bloqueia <a download>);
  // fora dele, o jeito normal do navegador funciona
  function baixarArquivo(nome, texto, tipo) {
    return new Promise(function (resolve, reject) {
      try {
        var b = new Blob([texto], { type: tipo || 'text/plain;charset=utf-8' });
        var u = URL.createObjectURL(b);
        var a = document.createElement('a');
        a.href = u; a.download = nome;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 0);
        resolve();
      } catch (e) { reject(e); }
    });
  }

    btn.disabled = true;
    baixarArquivo('quanto-sobrou-backup.json', JSON.stringify(dadosParaSalvar(), null, 1), 'application/json')

      .catch(function () { btn.disabled = false; erro('<b>O backup não foi baixado.</b> Ou você cancelou, ou esta visualização não permite baixar arquivos.'); });

  function aoRestaurar() {
    if (salvando) return;
    $('#aviso-erro').hidden = true;
    var txt = $('#backup-cola').value.trim();
    if (!txt) { erro('<b>Cole o conteúdo do backup primeiro.</b>'); return; }
    var novo;
    try { novo = JSON.parse(txt); } catch (e) {
      erro('<b>Esse texto não é um backup válido.</b> Copie o arquivo inteiro, do primeiro ao último caractere.');
      return;
    }
    if (!novo || !Array.isArray(novo.pessoas)) {
      erro('<b>Esse arquivo não parece um backup do Quanto Sobrou.</b>');
      return;
    }
    var minha = null;
    for (var i = 0; i < novo.pessoas.length; i++) if (novo.pessoas[i].id === PESSOA.id) minha = novo.pessoas[i];
    if (!minha || !Array.isArray(minha.itens)) {
      erro('<b>O backup não tem a aba <b>' + esc(PESSOA.nome) + '</b>.</b> Só dá para restaurar a sua própria aba.');
      return;
    }
    if (!window.confirm) { /* sem dialogo nativo; seguimos */ }

    $('#backup-cola').value = '';
    salvar(function () {
      // limpa o que existe hoje na minha aba e recria a partir do backup
      return api('/rest/v1/unidades?pessoa=eq.' + encodeURIComponent(PESSOA.id), {
        metodo: 'DELETE', extras: { Prefer: 'return=minimal' }
      }).then(conferir).then(function () {
        var nomes = {};
        for (var k = 0; k < minha.itens.length; k++) nomes[String(minha.itens[k].produto || '').trim()] = 1;
        (minha.produtos || []).forEach(function (p) { nomes[String(p.nome || '').trim()] = 1; });
        var lista = Object.keys(nomes).filter(function (x) { return x; });
        return lista.reduce(function (fila, nome) {
          return fila.then(function () { return garantirProduto(nome, ''); });
        }, Promise.resolve());
      }).then(function () {
        var porNome = {};
        for (var a = 0; a < PESSOA.produtos.length; a++) porNome[PESSOA.produtos[a].nome.trim().toLowerCase()] = PESSOA.produtos[a].id;
        var linhas = minha.itens.map(function (it) {
          var copia = JSON.parse(JSON.stringify(it));
          copia.produtoId = porNome[String(it.produto || '').trim().toLowerCase()];
          return copia;
        }).filter(function (x) { return x.produtoId; });
        PESSOA.itens = linhas;
        if (Array.isArray(minha.canais) && minha.canais.length) {
          PESSOA.canais = minha.canais;
          DADOS.canais = minha.canais;
        }
        var produtosAntigos = {}, unidadesAntigas = linhas.map(function (it) { return it.id; });
        (minha.produtos || []).forEach(function (p) { produtosAntigos[p.id] = porNome[String(p.nome || '').trim().toLowerCase()]; });
        minha.itens.forEach(function (it) { produtosAntigos[it.produtoId] = porNome[String(it.produto || '').trim().toLowerCase()]; });
        return (linhas.length ? criarUnidades(linhas) : Promise.resolve()).then(function () {
          var unidadesNovas = {};
          linhas.forEach(function (it, i) { unidadesNovas[unidadesAntigas[i]] = it.id; });
          PESSOA.canais.forEach(function (c) {
            var produtos = {}, vendas = {}, correcoes = {};
            Object.keys(c.produtos || {}).forEach(function (id) {
              if (produtosAntigos[id]) produtos[produtosAntigos[id]] = c.produtos[id];
            });
            Object.keys(c.vendas || {}).forEach(function (id) {
              if (unidadesNovas[id]) vendas[unidadesNovas[id]] = c.vendas[id];
            });
            Object.keys(c.correcaoPorsche20261013 || {}).forEach(function (id) {
              if (produtosAntigos[id]) correcoes[produtosAntigos[id]] = c.correcaoPorsche20261013[id];
            });
            c.produtos = produtos; c.vendas = vendas;
            c.correcaoPorsche20261013 = correcoes;
            if (c.gestao) {
              (c.gestao.devolucoes || []).forEach(function (d) {
                d.unidadeId = unidadesNovas[d.unidadeId] || d.unidadeId;
                d.produtoId = produtosAntigos[d.produtoId] || d.produtoId;
                if (d.venda) { d.venda.id = d.unidadeId; d.venda.produtoId = d.produtoId; }
              });
              (c.gestao.despesas || []).forEach(function (d) { if (d.produtoId) d.produtoId = produtosAntigos[d.produtoId] || ''; });
            }
          });
        });
      }).then(function () {
        return Array.isArray(minha.canais) && minha.canais.length ? gravarCanais(true) : Promise.resolve();
      }).then(function () {
        ativar(PESSOA.id);
        aplicarGestao(PESSOA);
        desenharCanais(); desenharAjustes(); desenharTudo();
      });
    }, $('#btn-restaurar'), 'Restaurar', function () {
      carregarDoBanco().then(function () { ativar(PESSOA.id); desenharCanais(); desenharAjustes(); desenharTudo(); });
    });
  }

  // confirmacao em dois toques. NAO usar window.confirm: dentro do iframe do artifact
  // ele devolve false sem abrir nada, e a acao morre em silencio.
  function desarmar(b) {
    clearTimeout(+b.getAttribute("data-timer"));
    if (b.getAttribute("data-original") !== null) b.innerHTML = b.getAttribute("data-original");
    b.removeAttribute("data-armado");
    b.classList.remove("armado");
    if (b.getAttribute("data-rotulo") !== null) b.setAttribute("aria-label", b.getAttribute("data-rotulo"));
  }
  function doisToques(botao, rotulo, aoConfirmar) {
    if (botao.getAttribute("data-armado")) { desarmar(botao); aoConfirmar(); return; }
    var outros = document.querySelectorAll("[data-armado]");
    for (var i = 0; i < outros.length; i++) desarmar(outros[i]);
    botao.setAttribute("data-original", botao.innerHTML);
    botao.setAttribute("data-rotulo", botao.getAttribute("aria-label") || "");
    botao.setAttribute("data-armado", "1");
    botao.classList.add("armado");
    botao.innerHTML = rotulo;
    botao.setAttribute("aria-label", rotulo + " " + (botao.getAttribute("data-rotulo") || ""));
    botao.setAttribute("data-timer", setTimeout(function () { desarmar(botao); }, 5000));
  }


  function tirarPorId(id) {
    for (var i = DADOS.itens.length - 1; i >= 0; i--) if (DADOS.itens[i].id === id) { DADOS.itens.splice(i, 1); return; }
  }

  // ---------- 1 · dar entrada ----------


  // ---------- 2 · chegada ----------

  // ---------- 3 · saida ----------
  function fecharPaineis() {
    vendendo = null; editando = null;
    $('#painel-venda').hidden = false;
    $('#venda-form').hidden = true;
    $('#venda-vazio').hidden = false;
    $('#painel-editar').hidden = true;
    $('#cupom').innerHTML = '';
    $('#v-seletor').value = '';
  }
  function abrirVenda(id) {
    if (salvando) return;
    var it = itemDe(id); if (!it) return;
    if (fase(it) !== 'estoque') { erro('<b>Esta unidade ainda não está disponível para venda.</b> Confirme o retorno na aba Devoluções.'); return; }
    editando = null; $('#painel-editar').hidden = true;
    vendendo = id;
    $('#v-seletor').value = id;
    irPara('vendas');
    $('#venda-vazio').hidden = true;
    $('#venda-form').hidden = false;
    $('#v-nome').textContent = it.produto;
    var meta = [];
    var g = grupoDe(it);
    if (g) meta.push('unidade ' + g.idx + ' de ' + g.total);
    if (it.fornecedor) meta.push(it.fornecedor);
    if (it.dChegada) meta.push('chegou ' + dataBR(it.dChegada));
    var d = dias(it.dChegada);
    if (d != null && d >= 0) meta.push(plural(d, 'dia parado', 'dias parados'));
    $('#v-meta').textContent = meta.join(' · ');
    $('#v-custo').textContent = brl(num(it.custo));
    $('#v-custo-edit').value = paraCampo(it.custo);
    $('#v-preco').value = '';
    $('#v-frete').value = '';
    RASCUNHOS_CUSTOS.v = {}; CANAL_CUSTOS.v = '';
    $('#v-lembrar').checked = true;
    $('#v-dvenda').value = hoje();
    var m = document.querySelector('#v-canais input:checked'); if (m) m.checked = false;
    escolherCustosVenda();
    desenharCupom();
    $('#v-preco').focus();
  }

  // ---------- alterar ----------
  function abrirEdicao(id) {
    if (salvando) return;
    var it = itemDe(id); if (!it) return;
    vendendo = null; $('#painel-venda').hidden = true; $('#cupom').innerHTML = '';
    editando = id;
    var g = grupoDe(it);
    $('#ed-selo').textContent = g ? g.idx + ' de ' + g.total : '';
    $('#ed-produto').value = it.produto || '';
    $('#ed-custo').value = paraCampo(it.custo);
    $('#ed-fornecedor').value = it.fornecedor || '';
    $('#ed-dcompra').value = it.dCompra || '';
    $('#ed-dchegada').value = it.dChegada || '';
    var dg = $('#ed-dica-grupo');
    if (g) {
      dg.innerHTML = '<span>↳</span><span>Isto muda <b>só esta unidade</b>. As outras ' + (g.total - 1) + ' continuam como estão.</span>';
      dg.hidden = false;
    } else { dg.hidden = true; }

    var vendido = fase(it) === 'vendido';
    RASCUNHOS_CUSTOS.ed = {}; CANAL_CUSTOS.ed = '';
    $('#ed-lembrar').checked = false;
    $('#ed-bloco-venda').hidden = !vendido;
    var atual = document.querySelector('#ed-canais input:checked');
    if (atual) atual.checked = false;
    if (vendido) {
      $('#ed-preco').value = paraCampo(it.preco);
      $('#ed-dvenda').value = it.dVenda || '';
      $('#ed-frete').value = it.frete == null ? '' : paraCampo(it.frete);
      var rad = document.querySelector('#ed-canais input[value="' + it.canal + '"]');
      if (rad) rad.checked = true;
      escolherCustosEdicao();
    }
    $('#painel-editar').hidden = false;
    var suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('#painel-editar').scrollIntoView({ behavior: suave ? 'smooth' : 'auto', block: 'center' });
    $('#ed-produto').focus();
  }


  // ---------- duplicar ----------


  // ---------- taxas ----------

  // ---------- exportar ----------
  function aoBaixar() {
    var linhas = [['Produto', 'Unidade', 'Situação', 'Onde comprou', 'Canal de venda', 'Data compra', 'Data chegada', 'Data saída',
      'Dias a caminho', 'Dias desde a primeira chegada', 'Custo de compra', 'Preço previsto', 'Venda efetiva', 'Taxa', 'Frete', 'Lucro da venda', 'Margem %', 'Retorno %',
      'Ciclo total em dias', 'Ocorrências anteriores', 'Custos das ocorrências', 'Última solicitação', 'Último retorno recebido']];
    var nomes = { caminho: 'A caminho', estoque: 'Em estoque', devolucao: 'Aguardando retorno', vendido: 'Vendido' };
    var dec = function (n) { return n.toFixed(2).replace('.', ','); };
    for (var i = 0; i < DADOS.itens.length; i++) {
      var it = DADOS.itens[i], f = fase(it), cn = canalDe(it.canal), c = contaDoItem(it);
      var g = grupoDe(it);
      var ocorrencias = historicoUnidade(it.id), ultima = ultimaDevolucao(it.id);
      var dCam = dias(it.dCompra, it.dChegada || null);
      var dPar = it.dChegada ? dias(it.dChegada, it.dVenda || null) : null;
      linhas.push([
        it.produto || '', g ? g.idx + ' de ' + g.total : '', nomes[f], it.fornecedor || '', cn ? cn.nome : '',
        dataBR(it.dCompra), dataBR(it.dChegada), dataBR(it.dVenda),
        dCam == null ? '' : dCam, dPar == null ? '' : dPar,
        dec(num(it.custo)),
        f !== 'vendido' && num(it.alvo) > 0 ? dec(num(it.alvo)) : '',
        f === 'vendido' ? dec(c.preco) : '', f === 'vendido' ? dec(c.taxa) : '',
        f === 'vendido' ? dec(c.frete) : '', f === 'vendido' ? dec(c.lucro) : '',
        f === 'vendido' && isFinite(c.margem) ? (c.margem * 100).toFixed(1).replace('.', ',') : '',
        f === 'vendido' && isFinite(c.roi) ? (c.roi * 100).toFixed(1).replace('.', ',') : '',
        diasCiclo(it) == null ? '' : diasCiclo(it), ocorrencias.length,
        dec(ocorrencias.reduce(function (s, d) { return s + num(d.custo); }, 0)), ultima ? dataBR(ultima.solicitadaEm) : '', ultima ? dataBR(ultima.recebidaEm) : ''
      ]);
    }
    var csv = linhas.map(function (l) {
      return l.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(';');
    }).join('\r\n');

    var btn = $('#btn-csv');
    btn.disabled = true;
    baixarArquivo('quanto-sobrou-' + (PESSOA ? PESSOA.id : 'dados') + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8')
      .then(function () { btn.disabled = false; })
      .catch(function () {
        btn.disabled = false;
        erro('<b>O download não foi concluído.</b> Ou você cancelou, ou esta visualização não permite baixar arquivos.');
      });
  }

  // ---------- eventos das linhas (redesenhadas a cada mudanca) ----------
  function ligarBotoesDeItem() {
    var liga = function (attr, fn) {
      var bs = document.querySelectorAll('[' + attr + ']');
      for (var i = 0; i < bs.length; i++) {
        (function (b) { b.onclick = function () { fn(b.getAttribute(attr), b); }; })(bs[i]);
      }
    };
    liga('data-chegou', abrirChegada);
    liga('data-confirma-chegada', confirmarChegada);
    liga('data-cancela-chegada', function (id) { var f = document.getElementById('form-chegada-' + id); if (f) f.hidden = true; });
    liga('data-vender', abrirVenda);
    liga('data-voltar', desfazerChegada);
    liga('data-devolver', abrirDevolucao);
    liga('data-historico-unidade', historicoDoProduto);
    liga('data-editar-dev', editarOcorrencia);
    liga('data-salvar-dev', aoSalvarOcorrencia);
    liga('data-dev-todas', function () { FILTRO_UNIDADE_DEV = ''; desenharDevolucoes(); ligarBotoesDeItem(); });
    liga('data-editar-despesa', abrirDespesa);
    liga('data-excluir-despesa', function (id, b) { doisToques(b, 'Excluir?', function () { excluirDespesa(id); }); });
    liga('data-editar', abrirEdicao);
    liga('data-duplicar', abrirDuplicar);
    liga('data-confirma-dup', confirmarDuplicar);
    liga('data-cancela-dup', function (id) { var f = document.getElementById('form-dup-' + id); if (f) f.hidden = true; });
    liga('data-apagar', function (id, b) { doisToques(b, 'Apagar?', function () { apagarItem(id); }); });
    liga('data-baixa', abrirBaixa);
    liga('data-confirma-baixa', confirmarBaixa);
    liga('data-cancela-baixa', function (id) { var f = document.getElementById('form-baixa-' + id); if (f) f.hidden = true; });
    liga('data-desbaixa', function (id, b) { doisToques(b, 'Desfazer?', function () { desfazerBaixa(id); }); });
    liga('data-pendencia', function (id) {
      if (id === 'caixa') { irPara('caixa'); return; }
      if (id === 'devolucoes') { FILTRO_UNIDADE_DEV = ''; $('#dev-status').value = 'pendente'; desenharDevolucoes(); ligarBotoesDeItem(); irPara('devolucoes'); return; }
      if (id === 'parado') { $('#estoque-busca').value = ''; $('#estoque-fase').value = 'parado'; desenharCaminho(); desenharEstoque(); ligarBotoesDeItem(); irPara('compras'); return; }
      $('#produtos-busca').value = ''; $('#produtos-status').value = 'sem-custos'; desenharProdutos(); irPara('produtos');
    });
  }

  // ---------- ligar tudo ----------
  document.getElementById('root').innerHTML = SHELL;
  var temaGuardado = 'auto', menuGuardado = 'aberto';
  try { temaGuardado = localStorage.getItem('qs-tema') || 'auto'; menuGuardado = localStorage.getItem('qs-menu') || 'aberto'; } catch (e) {}
  definirTema(temaGuardado); definirMenu(menuGuardado === 'compacto');
  if (!DADOS.pessoas || !DADOS.pessoas.length) {
    DADOS.pessoas = [{ id: 'vazio', nome: '—', dono: null, canais: [], produtos: [], itens: [] }];
  }
  ativar(DADOS.pessoas[0].id);
  try { MODULO = localStorage.getItem(CHAVE_MODULO) || 'painel'; } catch (e) {}
  var existe = false;
  for (var mm = 0; mm < MODULOS.length; mm++) if (MODULOS[mm].id === MODULO) existe = true;
  if (!existe) MODULO = 'painel';
  irPara(MODULO);
  desenharCanais();
  desenharAjustes();
  desenharTudo();
  $('#e-dcompra').value = hoje();
  desenharDicaEntrada();

  ['v-preco', 'v-frete', 'v-custo-edit'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', desenharCupom);
  });
  ['v', 'ed', 'pc'].forEach(function (prefixo) {
    ['pct', 'fixa', 'limite', 'frete'].forEach(function (campo) {
      $('#' + prefixo + '-' + campo).addEventListener('input', function () {
        if (prefixo === 'v') desenharCupom();
        if (prefixo === 'pc') $('#pc-sucesso').hidden = true;
      });
    });
    $('#' + prefixo + '-regra').addEventListener('change', function () {
      atualizarRegraCustos(prefixo);
      if (prefixo === 'v') desenharCupom();
      if (prefixo === 'pc') $('#pc-sucesso').hidden = true;
    });
  });
  $('#pc-produto').addEventListener('change', carregarCadastroCustos);
  $('#pc-canal').addEventListener('change', carregarCadastroCustos);
  $('#btn-custos-produto').addEventListener('click', aoSalvarCustosProduto);
  $('#btn-devolucao').addEventListener('click', aoRegistrarOcorrencia);
  $('#dev-comigo').addEventListener('change', function () { $('#dev-recebida-campo').hidden = !this.checked; });
  ['dev-busca', 'dev-status'].forEach(function (id) { $('#' + id).addEventListener(id === 'dev-busca' ? 'input' : 'change', function () { desenharDevolucoes(); ligarBotoesDeItem(); }); });
  $('#btn-despesa').addEventListener('click', aoSalvarDespesa);
  $('#btn-despesa-cancelar').addEventListener('click', function () { if (!salvando) limparDespesa(); });
  ['desp-busca', 'desp-filtro-categoria', 'desp-inicio', 'desp-fim'].forEach(function (id) { $('#' + id).addEventListener(id === 'desp-busca' ? 'input' : 'change', function () { desenharDespesas(); ligarBotoesDeItem(); }); });
  $('#btn-despesas-csv').addEventListener('click', exportarDespesas);
  limparOcorrencia(); limparDespesa();
  $('#btn-novo-produto').addEventListener('click', aoCadastrarProduto);
  $('#p-nome').addEventListener('keydown', function (e) { if (e.key === 'Enter') aoCadastrarProduto(); });
  $('#v-seletor').addEventListener('change', function () {
    if (salvando) { this.value = vendendo || ''; return; }
    if (this.value) abrirVenda(this.value); else fecharPaineis();
  });
  ['f-periodo', 'f-canal', 'f-inicio', 'f-fim'].forEach(function (id) { $('#' + id).addEventListener('change', atualizarAnalise); });
  ['estoque-busca', 'estoque-fase', 'estoque-ordem'].forEach(function (id) { $('#' + id).addEventListener(id === 'estoque-busca' ? 'input' : 'change', function () { desenharCaminho(); desenharEstoque(); ligarBotoesDeItem(); }); });
  ['vendas-busca', 'vendas-status', 'vendas-ordem'].forEach(function (id) { $('#' + id).addEventListener(id === 'vendas-busca' ? 'input' : 'change', function () { desenharVendidos(); ligarBotoesDeItem(); }); });
  ['produtos-busca', 'produtos-status'].forEach(function (id) { $('#' + id).addEventListener(id === 'produtos-busca' ? 'input' : 'change', desenharProdutos); });
  $('#caixa-busca').addEventListener('input', function () { desenharCaixa(); ligarBotoesDeItem(); });
  $('#graf-faturamento').addEventListener('click', function () { GRAF_METRICA = 'faturamento'; desenharGraficoDiario(); });
  $('#graf-lucro').addEventListener('click', function () { GRAF_METRICA = 'lucro'; desenharGraficoDiario(); });
  $('#tema-select').addEventListener('change', function () { definirTema(this.value); });
  $('#btn-tema').addEventListener('click', function () { var opcoes = ['auto', 'light', 'dark']; definirTema(opcoes[(opcoes.indexOf($('#tema-select').value) + 1) % 3]); });
  $('#menu-select').addEventListener('change', function () { definirMenu(this.value === 'compacto'); });
  $('#btn-sidebar').addEventListener('click', function () { definirMenu($('#menu-select').value !== 'compacto'); });
  $('#atalho-compra').addEventListener('click', function () { irPara('compras'); $('#e-produto').focus(); });
  $('#atalho-venda').addEventListener('click', function () { irPara('vendas'); $('#v-seletor').focus(); });
  var atalhos = document.querySelectorAll('[data-atalho]');
  for (var at = 0; at < atalhos.length; at++) atalhos[at].addEventListener('click', function () { irPara(this.getAttribute('data-atalho')); });
  ['e-qtd', 'e-custo'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', desenharDicaEntrada);
  });
  $('#e-produto').addEventListener('input', function () {
    var nome = $('#e-produto').value.trim(), d = $('#e-dica-cadastro');
    if (!nome) { d.hidden = true; return; }
    var achado = null;
    for (var i = 0; i < PESSOA.produtos.length; i++) {
      if (PESSOA.produtos[i].nome.trim().toLowerCase() === nome.toLowerCase()) achado = PESSOA.produtos[i];
    }
    if (achado) {
      var quantos = 0;
      for (var j = 0; j < PESSOA.itens.length; j++) if (PESSOA.itens[j].produtoId === achado.id) quantos++;
      d.innerHTML = '<span>↳</span><span>Já cadastrado — esta será a <b>' + (quantos + 1) + 'ª</b> unidade dele.</span>';
    } else {
      d.innerHTML = '<span>↳</span><span>Produto novo. Vai virar um cadastro, e da próxima vez aparece na lista.</span>';
    }
    d.hidden = false;
  });
  $('#btn-entrada').addEventListener('click', aoDarEntrada);
  $('#btn-venda').addEventListener('click', confirmarVenda);
  $('#btn-cancelar-venda').addEventListener('click', fecharPaineis);
  $('#btn-editar-salvar').addEventListener('click', salvarEdicao);
  $('#btn-editar-cancelar').addEventListener('click', fecharPaineis);
  $('#btn-taxas').addEventListener('click', aoSalvarTaxas);
  $('#btn-proj-sugerir').addEventListener('click', sugerirPrecos);
  $('#btn-proj-salvar').addEventListener('click', salvarProjecao);
  $('#btn-csv').addEventListener('click', aoBaixar);
  var relogioGrafico = 0;
  window.addEventListener('resize', function () {
    clearTimeout(relogioGrafico);
    relogioGrafico = setTimeout(function () { if (!$('#app').hidden) desenharGraficoDiario(); }, 180);
  });
  $('#btn-entrar').addEventListener('click', tentarEntrar);
  $('#login-senha').addEventListener('keydown', function (e) { if (e.key === 'Enter') tentarEntrar(); });
  $('#btn-backup').addEventListener('click', aoBackup);
  $('#btn-restaurar').addEventListener('click', aoRestaurar);
  $('#e-produto').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#e-custo').focus(); });
  $('#e-custo').addEventListener('keydown', function (e) { if (e.key === 'Enter') aoDarEntrada(); });

  // devolve ao formulario uma entrada que nao chegou a ser salva
  try {
    var pend = sessionStorage.getItem('qs-pendente');
    if (pend) {
      sessionStorage.removeItem('qs-pendente');
      var p = JSON.parse(pend);
      $('#e-produto').value = p.produto || '';
      if (p.custo) $('#e-custo').value = String(p.custo).replace('.', ',');
      $('#e-qtd').value = p.qtd || 1;
      $('#e-fornecedor').value = p.fornecedor || '';
      $('#e-dcompra').value = p.dCompra || hoje();
      $('#e-jachegou').checked = !!p.dChegada;
      $('#aviso-pendente').hidden = false;
      desenharDicaEntrada();
    }
  } catch (e) {}

  if (!configurado()) {
    $('#login-erro').innerHTML = 'Este app ainda não foi ligado ao banco de dados.';
    $('#btn-entrar').disabled = true;
  } else {
    try {
      var guardada = localStorage.getItem(CHAVE_SESSAO);
      if (guardada) {
        SESSAO = JSON.parse(guardada);
        carregarDoBanco().then(abrirApp).catch(function (e) {
          // So derruba o login quando a sessao morreu de verdade. Rede fora do ar,
          // banco de joelhos ou tabela faltando nao sao motivo para deslogar: o
          // refresh_token continua valendo e a proxima tentativa aproveita.
          if (e && e.tipo === 'sem-sessao') guardarSessao(null);
          $('#login-erro').textContent = recadoDeFalha(e);
        });
      }
    } catch (e) { guardarSessao(null); }
  }


})();
</script>
